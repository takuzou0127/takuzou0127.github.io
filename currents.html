<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div>🆕 <b>AIの需要</b> → 建てるお金を<b>借りて</b>まかなう → <b>金利が高いほど負担が重い</b> → 「お金が足りない」が制約になる</div>
  <div>この週の変化（解釈）：3本目の鎖が加わり、①②の「金利の鎖」と③の「AIの鎖」が<b>お金</b>でつながり始めました。FRBの議事要旨も、物価を押し上げる要因として「エネルギー」と並んで「AIの需要」を挙げています（②）。そこへ10/13、⑦の「中国の追い上げ」が重なり、メモリだけが大きく売られました。</div>
  <div style="font-size:14px;color:#8b93a1">このページは10/14夜（米9月CPIの発表前）に作成。CPIの結果は入っていません。</div>
</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave hot">
  <h3>① 戦争と原油 ─ 1バレル70ドル台の時代が終わった</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-up">強まっている</span><span>保有には：逆風</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ 一時 <b>約$70</b>（7/1）→ $100〜102（10/6〜7）→ <b class="down">$105台</b>（10/13）</div>
  <p><span class="k">10/7版から：</span>$100〜102 → $105台（約+3〜5%）。交渉の進展ではなく、タンカーへの攻撃が増えたことが今週の材料です。強さは「強まっている」のまま。</p>
  <p><span class="k">何が起きている：</span>9/28〜10/5の1週間で、ホルムズ海峡とその周辺で少なくとも12隻のタンカーが攻撃を受けました（ロイター、The National 10/13経由）。ある日曜には1日で6隻（英UKMTO）。イラン側は「海峡は閉鎖され、イランの管理下」と主張し、ルビオ国務長官はこれを否定しています。トランプ氏は経済的な圧力でイランを交渉に戻す方針です。</p>
  <p><span class="k">なぜ大事：</span>原油は物価の土台です。原油が高いままだと物価が下がらず、中央銀行は金利を下げられません（②につながる）。日本は円安（1ドル158円前後・10/6時点。今週の値は未取得）も重なり、輸入物価が二重に上がります。</p>
  <p><span class="k">分かれ目：</span>海峡が再開すれば「原油安→物価が落ち着く→金利低下→ハイテク株に追い風」。攻撃が続けば、原油と金利が一緒に上がる形が続きます。「イスラエルが選挙前の戦闘再開を求めた」との報道は首相府が否定しており（Times of Israel）、和平・決裂どちらの見出しも1本では判断しないことが大事です。</p>
  <div class="me"><span class="k">保有にとって：</span>直接ではなく、②の金利を通して効きます。今夜の米CPIは上昇の大半がガソリン高と予想されており、原油→物価の鎖がそのまま数字に出る日です。</div>
  <div class="src">出典：<a href="https://thenationalnews.com/news/gulf/2026/10/13/strait-of-hormuz-attacks-surge-as-iran-steps-up-campaign-against-us-backed-oil-shipping">The National（10/13）</a>・<a href="https://www.cnbc.com/2026/10/08/oil-prices-today-brent-wti-hormuz.html">CNBC（10/8）</a>・ブリーフィング10/14版（Tickmill・Times of Israel）・<a href="https://www.oanda.jp/lab-education/?p=129785">OANDA（10/6）</a></div>
</div>

<div class="wave mix">
  <h3>② 金利の時代が戻った ─ 「利下げを待つ相場」から「利上げを警戒する相場」へ</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-flat">高止まり（10/7版：強まっている）</span><span>保有には：逆風</span></div>
  <div class="num">米10年債 5.27%（10/7）→ <b class="down">約5.2%</b>（10/13、ソースにより5.19〜5.26%）／12月の追加利上げの織り込み <b class="down">約84%</b>（CME、10/7）</div>
  <p><span class="k">10/7版から：</span>10年債は5.3%の手前で止まり、わずかに下がりました。一方で年内の利上げ観測は8割を超えたままです。「上がり続けている」から「高い所で止まっている」に判定を変えました。</p>
  <p><span class="k">何が起きている：</span>10/7公表の9月FOMC議事要旨では、大半の参加者が「年内にもう1回の利上げが適切になりそう」と見ていました。理由として、<b>エネルギーとAI需要による物価上昇</b>がより長く続く形に広がるのを防ぐ、という意見も挙がりました。10/13はウォラー理事の「高い利回りが金利に敏感な分野の需要を抑えている」との発言で長期金利が下がりました。</p>
  <p><span class="k">なぜ大事：</span>金利が上がると、何年も先の利益を見込んで買われている株ほど値段がつきにくくなります。さらに③のとおり、AIの設備を借金で建てる形が広がっているため、金利は「株の値段」だけでなく「AI投資の資金繰り」にも効き始めています（解釈）。</p>
  <p><span class="k">今の綱引き：</span>今夜21:30に米9月CPI。予想は前年比+3.6〜3.7%（前月3.4%）、上昇の大半はガソリン高、コアは2.4%前後。コアが予想を上回れば10/27〜28のFOMCでの追加利上げが意識されます。</p>
  <div class="me"><span class="k">保有にとって：</span>メモリ株は値動きが大きいので、金利が跳ねた日に大きく下げやすい側です。次の山は今夜のCPIとFOMC（10/27〜28）。</div>
  <div class="src">出典：<a href="https://www.scotsmanguide.com/news/fed-policymakers-saw-multiple-2026-rate-hikes-as-likely-september-fomc-minutes-show/">Scotsman Guide（10/7・議事要旨とCME）</a>・ブリーフィング10/14版（Bloomberg・Admiral Markets）</div>
</div>

<div class="wave hot">
  <h3>③ AIの足りないものが「チップ」→「電気」→ 🆕「お金」へ</h3>
  <div class="tags"><span>始まり：2025年〜、「お金」は2026年10月に表面化</span><span class="s-up">強まっている</span><span>保有には：両方</span></div>
  <div class="num">電気：米国の新しいデータセンター電力 約68GWのうち <b class="down">38GW（約56%）</b>にめどなし（Morgan Stanley・8月半ばの報告）<br>お金：BroadcomがOpenAIのチップ購入資金として <b class="down">500億ドル超</b>の融資を手配中（WSJ・10/7）</div>
  <p><span class="k">10/7版から：</span>電力の新しい数字はありません。なお10/7版の「32GW不足（34%）」とMorgan Stanleyの8月報告の「38GW（56%）」は集計の仕方が違い、出典で割れています。今週の新しい点は「お金」が制約として語られ始めたことです（🆕）。</p>
  <p><span class="k">何が起きている：</span>BroadcomはOpenAIと共同設計するチップ（2029年末までに10GW分）の購入資金について、Apollo・Blackstoneなどと500億ドル超の融資を協議しています（WSJ 10/7）。Anthropicの上場目論見書によると、BroadcomはGoogle TPUの計算能力のリース（5年で1,252億ドル）向けに、Anthropicへ最大420億ドルを転換社債で融資します（ロイター 10/1）。10/12にはBroadcomのタンCEOが「資金調達がAI拡大の最大の制約になりうる」と述べ（Yahoo Finance・1ソースのみ）、Intel経営陣の同じ趣旨の警告とともに、10/13の世界的な半導体売りの一因として報じられました。</p>
  <p><span class="k">なぜ大事：</span>チップ不足・電力不足は「作れば売れる」側の制約でした。お金の制約は「買い手が払い続けられるか」の制約で、性質が違います。売り手が買い手にお金を貸して買ってもらう形が広がるほど、AIの需要は②の金利や信用の変化に揺れやすくなります（解釈）。</p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝大手の設備投資の計画（Amazon 約2,200億ドル・Alphabet 1,950〜2,050億ドルなど、7月末の決算時点）は減額されていない。逆＝新しく増える分ほど融資・リースに頼っており、その資金が細ると増え方が鈍る。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル③（ハイパースケーラーの設備投資の減額）はまだ点いていません。確認の場は明日（10/15）のTSMC決算と、10月後半の大手の決算です。</div>
  <div class="src">出典：<a href="https://cryptobriefing.com/morgan-stanley-ai-data-centers-38-gigawatt-power-gap/">Crypto Briefing（8/26・Morgan Stanley）</a>・ブリーフィング10/14版（WSJ 10/7・ロイター 10/1・Yahoo Finance・valueaddvc集計）</div>
</div>

<div class="wave">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている</span><span>保有には：中立〜追い風</span></div>
  <div class="num">10/13の値動き：設計する側 NVDA <b>+0.77%</b>・AMD <b>+1.71%</b>・AVGO <b>+0.75%</b> ／ 作る側のメモリ4銘柄 平均 <b class="down">-6.16%</b><br>NVDA：AVGOの売上の比 約89：11（1年前）→ 約84：16（10/7版の値）</div>
  <p><span class="k">10/7版から：</span>新しい大口契約の発表はありません。ただ10/13に、「お金は需要を自分の口で言える設計会社へ、メモリは待たされる側」という形が、1日の値動きとしてはっきり出ました。</p>
  <p><span class="k">何が起きている：</span>OpenAIはNVIDIAのGPUを主力に、AMD（6GW契約）、Broadcomと共同設計の自社チップ（年末から配備、10GW規模）、Cerebrasを併用。AnthropicはGoogle TPU（Broadcom共同設計、3.5GW・最大5GW）。10/8にはSamsungの7〜9月の営業利益が107.4兆ウォン（速報、前年の約8.8倍）と過去最高になり、HBM4などメモリが牽引しました。</p>
  <p><span class="k">なぜ大事：</span>買い手が1社に頼らなくなるほど、チップの横に載るHBMの買い手も分散します。どのチップが勝っても、Cerebras以外はHBMを積みます。</p>
  <div class="me"><span class="k">保有にとって：</span>メモリの利益は過去最高を更新し続けていますが、予想に対する上振れはSamsungで+0.7%まで縮みました。利益の「大きさ」はすでに予想に入っており、株価は「いつまで続くか」で動く段階です（ブリーフィング10/14版の整理）。</div>
  <div class="src">出典：<a href="https://news.samsung.com/global/">Samsung Newsroom（10/8）</a>・ブリーフィング10/14版（株価・AIチップの表）・10/7版（売上の比）</div>
</div>

<div class="wave mix">
  <h3>⑤ 一握りの会社に集中する市場 ─ 逆回転の試しが入った</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-flat">高止まり（逆回転の試しあり）</span><span>保有には：両方</span></div>
  <div class="num">KOSPI <b class="down">-5.46%</b>（10/13、6,035。一時-7%超）／SK Hynix <b class="down">-10.09%</b>・Samsung <b class="down">-7.39%</b>／外国人 <b class="down">2.335兆ウォン</b>売り越し・個人 1.311兆ウォン買い越し</div>
  <p><span class="k">10/7版から：</span>10/7版で「流れが逆回転すると、指数ごと大きく下げる」と書いたことが、10/13にそのまま起きました。集中そのものはまだ解けていないので判定は「高止まり」のままですが、試しが入りました。10/14朝はKOSPIが一時+1.8%反発したものの、外国人の売りは続いたと報じられています（取引時間中の値）。</p>
  <p><span class="k">何が起きている：</span>KOSPIの約47%を2社が占めるため、2社の急落がそのまま指数の急落になりました。韓国だけの需給（Samsungの社員向け自社株買いの終了、SK Hynixの自社株買い・消却がほぼ完了、レバレッジ型商品の-16%超の急落による巻き戻し、外国人売り）が上乗せされ、同じ夜の米国ではSKHY（ADR）-3.16%・MU -3.98%にとどまりました。</p>
  <p><span class="k">なぜ大事：</span>指数を買っても実は同じ数社に賭けている状態です。米国でも半導体指数は6月の最高値から約-17%（Bloomberg、10/13日中の値）まで下げています。</p>
  <div class="me"><span class="k">保有にとって：</span>000660と005930を両方持つのは「KOSPIの半分」を持つのとほぼ同じ向き。10/13はその構造がそのまま値動きに出た日で、同じ会社でも韓国本株とADRで1日の値動きが約7pt違いました。</div>
  <div class="src">出典：ブリーフィング10/14版（Korea JoongAng Daily・Investing.com・Bloomberg・TokenPost）</div>
</div>

<div class="wave">
  <h3>⑥ 政治の季節 ─ 米中間選挙と日本の財政</h3>
  <div class="tags"><span>山場：11/3（米中間選挙）</span><span class="s-up">近づいている（あと20日）</span><span>保有には：間接</span></div>
  <div class="num">民主党の支持のリード +8.9ポイント（10/7版の値。今週の平均は未取得）／参考：NBCの平均 52%対43%で+9（9/28）／日本の臨時国会 12/12まで</div>
  <p><span class="k">10/7版から：</span>世論調査の今週の平均は確かめられませんでした。判定は据え置き（未取得）。</p>
  <p><span class="k">何が起きている：</span>米国では物価（原油高）への不満が争点で、トランプ大統領の支持率はインフレ対応で大きくマイナス（Silver Bulletin、9/28時点）。共和党は安全とされた議席の防衛に追われていると報じられています。日本は食料品の消費税減税が焦点です。</p>
  <p><span class="k">なぜ大事：</span>選挙の後、イランへの方針（①）や関税が変わりうるからです。日本は減税＝国の借金が増える→長期金利・円安の論点になります。</p>
  <div class="me"><span class="k">保有にとって：</span>半導体への関税・輸出規制の変化に注意。CXMTなど中国メモリへの規制の議論（⑦）も、選挙後の政権の方針で動きうる論点です。</div>
  <div class="src">出典：<a href="https://ibtimes.com/democrats-hold-9-point-lead-generic-ballot-strong-support-among-independents-polls-3807896">IBTimes（9/28・NBC平均とSilver Bulletin）</a>・10/7版（Nate Silver Bulletin・NPR）</div>
</div>

<div class="wave hot">
  <h3>⑦ 中国のAIの自前化 ─ 汎用DRAMから先に来た</h3>
  <div class="tags"><span>始まり：2023年の輸出規制〜</span><span class="s-up">強まっている（市場の警戒。10/7版：じわじわ）</span><span>保有には：逆風（汎用DRAMの値段）</span></div>
  <div class="num">CXMTのDRAMシェア <b>4%</b>（前年）→ <b class="down">10%</b>（2026年4〜6月、Counterpoint）<br>10/10発表：4F²構造のサーバー用DDR5（年末投入予定・密度30〜50%向上）</div>
  <p><span class="k">10/7版から：</span>「じわじわ」→「強まっている」に変えました。理由は、CXMTの新製品の発表に韓国市場が10/13に-5.5%で反応したこと。ただし量産の開始・仕様・顧客の品質認定はどれも未公表で、<b>中身の新しい事実はまだありません</b>。強まったのは市場の警戒です。</p>
  <p><span class="k">何が起きている：</span>今回の発表は1枚ずつ使う汎用のサーバー用DDR5で、HBMの難所（積み重ね・貫通電極・GPUとの接続）は対象外です。「中国が追い上げる」で韓国2社が1日に-8〜10%下げたのは、7/28のCXMT上場日（Samsung -8%・SK Hynix -9.6%）に続き今年2回目。CXMTはASMLの最先端EUV露光装置を輸出規制で入手できず、最先端品には制約があると指摘されています。</p>
  <p><span class="k">なぜ大事：</span>汎用DRAMは「最高でなくていい」用途が多く、「十分に良くて安い」製品が入ると、3社の寡占の<b>値段</b>が崩れる道ができます。一方HBMは「最高でないと使えない」用途で、まだ3社の世界です。テーゼの核（HBMは必須）と、汎用DRAMの値段の話は分けて見る必要があります。</p>
  <p><span class="k">分かれ目：</span>CXMTの量産開始・大口顧客の採用が報じられたら本物の変化。逆に量産が遅れれば、今回の下げは需給の一時的な振れだったことになります。7月の上場時には「名目の生産能力と実際の出荷は違う。1〜2年で供給不足は解消しない」との見方も出ていました（Eugene投資証券）。</p>
  <div class="me"><span class="k">保有にとって：</span>000660・005930・MUのすべてに、汎用DRAMの値段を通して効く逆風の候補。HBMの3社寡占の評価は変わっていません。次の確認は10/27のSK Hynix決算説明会でCXMTについて何を言うか。</div>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年10月14日版（クラウドで週次更新・前回は10/7版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
