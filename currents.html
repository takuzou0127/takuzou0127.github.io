<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div><b>AIの需要</b> → 建てるお金を<b>借りて</b>まかなう → <b>金利が高いほど負担が重い</b> → 「お金が足りない」が制約になる</div>
  <div>🆕 <b>AIの需要</b> → 工場を増やしたい → <b>建屋（クリーンルーム）と部品が足りない</b> → 「作りたくても作れない」 → 装置・メモリの増産が遅れる</div>
  <div>この週の変化（解釈）：1本目の鎖が<b>ねじれました</b>。原油は$105台から$114〜116へ上がったのに、米10年債は5.2%から5%割れへ下がりました。理由ははっきりしません（報道は「来週のFOMCは据え置き確実」とするだけ）。3本目の「お金」の鎖は太くなり（Meta・OpenAI・Anthropic）、4本目の「建屋と部品」が新しく加わりました（10/21のLam決算）。その結果、10/22に半導体指数は1日で-6.6%下げました。どの鎖も「需要が減った」話ではない点は先週と同じです。</div>
  <div style="font-size:14px;color:#8b93a1">このページは10/24（土）昼に作成。株価は10/23の終値（PCの日次ブリーフィングの値）。</div>
</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave hot">
  <h3>① 戦争と原油 ─ 「選挙のあと」を先に値段に入れ始めた</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-up">強まっている</span><span>保有には：逆風</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ 一時 <b>約$70</b>（7/1）→ $105台（10/13）→ $109.2（10/20）→ <b class="down">$114〜116</b>（10/23、5月以来の高値）</div>
  <p><span class="k">10/14版から：</span>$105台 → $114〜116（約+9〜10%）。エネルギー株のETF（XLE）は過去最高です。強さは「強まっている」のまま。</p>
  <p><span class="k">何が起きている：</span>トランプ大統領は「中間選挙（11/3）の前にはイランを攻撃しない」と言いました。一方で米政府の高官は「今週末の攻撃」の可能性を否定せず、NYTは米国とイスラエルが<b>選挙後の攻撃の計画</b>を作っていると報じました。財務省はイランの原油を運んだ船17隻に制裁をかけています（CBS、10/23）。10/20には革命防衛隊が「タンカー2隻が機雷で被害」と主張しました（CBS・ABC）。</p>
  <p><span class="k">なぜ大事：</span>原油は物価の土台です。9月の米CPIは前年比+3.7%で、上昇の半分以上がガソリン（前年比約+34%）でした（②）。日本の9月の消費者物価（生鮮食品を除く）も+2.1%と、9か月ぶりに2%台に戻りました（NHK）。</p>
  <p><span class="k">分かれ目：</span>11/3の選挙の後に攻撃が実際に起きるか、です。原油は「選挙後のリスク」を先に値段に入れ始めたとみられます（推定。PCのブリーフィング10/24版の読み）。攻撃がなく海峡の通航が戻れば、この上乗せ分ははがれます。</p>
  <div class="me"><span class="k">保有にとって：</span>先週までは「原油→金利→ハイテク株」の順に効いていました。今週は金利が下がったので、その道筋は弱まりました。代わりに10/23は「原油と物価の不安」で半導体<b>以外</b>が売られました。保有への直接の効き方は、今週は小さめです。</div>
  <div class="src">出典：ブリーフィング10/24版（CBS・Benzinga・Yahoo Finance・NHK）・10/21版（CBS・ABC）・10/15版（XTB・Motley Fool、9月CPI）</div>
</div>

<div class="wave mix">
  <h3>② 金利の時代 ─ 原油は上がったのに、長期金利は5%を割った</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-dn">弱まっている（10/14版：高止まり）</span><span>保有には：逆風（やや和らぐ）</span></div>
  <div class="num">米10年債 5.27%（10/7）→ 約5.2%（10/13）→ 5.12%（10/20）→ <b class="up">約4.98〜4.99%</b>（10/23）／ドル円 158.2円（10/20）→ <b>約156.95円</b>（10/23）</div>
  <p><span class="k">10/14版から：</span>10年債は約0.2pt下がり、5%を割りました。10/14の9月CPI（前年比+3.7%・コア+2.6%、どちらも予想を0.1pt上回る）の直後は、10月末の利上げの確率が約22%から約44〜50%へ跳ねました。それが今週は「10/27〜28のFOMCは据え置きが確実」という見方に変わっています（外為どっとコム、10/24版経由）。判定を「高止まり」から「弱まっている」に変えました。</p>
  <p><span class="k">何が起きている：</span>原油が上がった週に金利が下がったのは、ふつうとは逆の動きです。理由ははっきりしません。考えられるのは、①CPIの後の利上げの読みが行き過ぎで戻した、②10/22の半導体の急落で「安全な債券」が買われた、の2つですが、どちらも確かめられていません。</p>
  <p><span class="k">なぜ大事：</span>金利が下がると、何年も先の利益で買われている株には追い風です。ただ、原油が$115近くのままなら物価はまた上がり、12月の利上げの話が戻ってきます。日銀も来週は据え置きの見方で、年内の利上げの観測は約6割です（10/24版）。</p>
  <div class="me"><span class="k">保有にとって：</span>10/14は「振れ幅の大きい銘柄から順に売る」形でメモリが売られました（米国20銘柄で、下げ幅と1年の振れ幅の順位相関が-0.77）。金利が下がった今週もメモリは戻っていないので、今のメモリの下げの主な理由は金利ではありません（③⑤⑦）。</div>
  <div class="src">出典：ブリーフィング10/24版（Bloomberg・外為どっとコム）・10/21版（yfinance ^TNX）・10/15版（XTB・Washington Times（AP）・Motley Fool）</div>
</div>

<div class="wave hot">
  <h3>③ AIの足りないもの ─ 「チップ」→「電気」→「お金」→ 🆕「建屋と部品」</h3>
  <div class="tags"><span>始まり：2025年〜（「お金」は10月上旬、「建屋と部品」は10/21に表面化）</span><span class="s-up">強まっている</span><span>保有には：両方</span></div>
  <div class="num">お金：Metaのフリーキャッシュフロー <b class="down">-$2.1B</b>（7〜9月）でも、2026年の設備投資の下限は$130B→<b>$135B</b>に引き上げ（10/21）<br>建屋と部品：Lamの経営陣「クリーンルームの空きと部品不足が<b class="down">2027年まで</b>チップメーカーを縛りうる」（10/21）<br>作る側：TSMC「AIの需要はまだ供給能力を上回る」。2026年の設備投資は$60〜64Bで据え置き（10/15）</div>
  <p><span class="k">10/14版から：</span>「お金」の鎖が太くなりました。Metaは稼ぎを上回る額を投資に回し始め、OpenAIは評価額$1.25Tで最大$30Bの資金集めを来週中にまとめる方向です（TechCrunch）。AnthropicはBroadcomが手配したTPU向けの借入$60Bのうち$9B分について、Blackstoneに10%超の利回りを示したと報じられました（FT報道の二次情報）。🆕は「建屋と部品」です。電力の新しい数字は見つかりませんでした（電気の部分は据え置き・未取得）。</p>
  <p><span class="k">何が起きている：</span>Lamの7〜9月期は売上$8.22B（予想約$8.14B）と過去最高でした。それでもCFOは「部品の供給制約がなければ、10〜12月の見通し（$8.6B）はもっと高かった」と話しました。LRCXは-11.6%、装置・検査の8銘柄は平均約-8.6%下げ、半導体指数SOXは10/22に1日で-6.6%下げました。10/14には、GPUを借金で買って貸すCoreWeaveの社債が「経営不安の水準」で取引されていると報じられました（Bloomberg、詳細は未確認）。</p>
  <p><span class="k">なぜ大事：</span>「建屋と部品」の制約は、作る側の制約です。需要が減ったわけではなく、増やしたくても増やせない形です。メモリにとっては<b>値段が下がりにくい方向</b>（推定）ですが、装置の売上は後ろへずれます。「お金」の制約は払う側の制約で、金利や信用の変化に需要が揺れやすくなります（解釈）。</p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝大手4社の2026年の設備投資は合計約$750B（前年約$410Bから+80%超、Bloomberg系の集計）。Metaは減額せず、むしろ下限を上げました（Microsoft・Alphabet・Amazonは10/28〜29に決算）。TSMCは2026年の売上の伸びを「40%強」から約44%に上げました。逆＝増える分ほど借入・資金集めに頼っています。Anthropicの借入に10%超の利回りがつくのは、貸す側がそれなりのリスクを見ているしるしです（推定）。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル③（ハイパースケーラーの設備投資の減額）はまだ点いていません。ただし「払い方」には黄信号が続いています。確認の場は10/28のMSFT・GOOGL、10/29頃のAMZNの決算で、「稼ぎで払えているか」がMetaとの比べどころです。</div>
  <div class="src">出典：ブリーフィング10/23版（Lam決算・Meta）・10/24版（TechCrunch・Unusual Whales（Bloomberg要約）・FT報道の二次情報）・10/15版（Motley Fool・Bloomberg）・<a href="https://www.crnasia.com/news/2026/components-and-peripherals/tsmc-third-quarter-revenue-tops-guidance-as-ceo-says-ai-dema">CRN Asia（TSMC、10/15）</a>・<a href="https://cryptobriefing.com/tsmc-capex-64-billion-ai-demand/">Crypto Briefing（TSMCの設備投資）</a></div>
</div>

<div class="wave mix">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている</span><span>保有には：中立〜追い風</span></div>
  <div class="num">NVDA：AVGOの売上の比 約89：11（1年前）→ <b>約84：16</b>（新しい決算なし。次はNVDA 11/18・AVGO 12/10）<br>TSMCの売上のうちHPC（AI・データセンター向け） <b>68%</b>（7〜9月、前期比+22%）</div>
  <p><span class="k">10/14版から：</span>比の数字は変わっていません。新しい点は、AnthropicのTPU（Broadcom共同設計）に「借入$60B」という形でお金がつき、OpenAIはNVIDIA・AMD・自社チップ・Cerebras・Google Cloudと買い先をさらに広げたことです。</p>
  <p><span class="k">何が起きている：</span>10/23は、設計会社のうちAMD・QCOMが+1.4%台で戻ったのに、AIの2本柱のNVDA（-0.55%）とAVGO（-0.46%）だけが戻りませんでした。理由ははっきりしません（決算前の持ち高の調整かもしれませんが、確かめられていません）。</p>
  <p><span class="k">なぜ大事：</span>買い手が1社に頼らないほど、チップの横に載るHBMの買い手も散らばります。どのチップが勝っても、Cerebras以外はHBMを積みます。この構図は先週と同じです。</p>
  <div class="me"><span class="k">保有にとって：</span>AnthropicのTPUの借入も、OpenAIの資金集めも、「HBMを積むチップの代金を外のお金で前払いする」動きです。MU・000660・005930の需要の側の話としては追い風が続いています。</div>
  <div class="src">出典：ブリーフィング10/24版（AIチップの表・③の騰落）・<a href="https://futurumgroup.com/?p=96944">Futurum（TSMC 7〜9月期）</a></div>
</div>

<div class="wave hot">
  <h3>⑤ 一握りの会社に集中する市場 ─ 逆回転が進んだ</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-dn">弱まっている（逆回転が進む。10/14版：高止まり）</span><span>保有には：逆風</span></div>
  <div class="num">KOSPI 6,035（10/13）→ 5,552.74（10/20）→ <b class="down">5,550.30</b>（10/23）／SK Hynix本株 10月だけで<b class="down">約-31%</b>／SOX 11,698（10/14）→ <b class="down">10,758.51</b>（10/23）</div>
  <p><span class="k">10/14版から：</span>10/14版で「試しが入った」と書いた逆回転が、この10日で進みました。KOSPIは10/13からさらに約-8%、SOXは10/14からさらに約-8%です。判定を「高止まり」から「弱まっている（逆回転）」に変えました。お金は医療・景気に左右されにくい株（10/20）や、エネルギー（10/23）へ移っています。</p>
  <p><span class="k">何が起きている：</span>韓国では、SamsungとSK HynixがKOSPIの時価総額の約半分を占めます（Korea JoongAng Daily）。外国人は売り続けていて、10/23も約1兆ウォンの売り越しでした（機関投資家の買いが支えました）。ただ10/23は、SK Hynixが米国の子会社ソリダイムの上場の検討をやめると発表して<b class="up">+4.4%</b>反発し、一時-4%超だったKOSPIを+0.30%まで引き戻しました。同じ日のSamsungは+0.47%でした。</p>
  <p><span class="k">なぜ大事：</span>指数を買っても、実は同じ数社に賭けている状態です。集中が逆に回ると、指数ごと大きく下げます。10/23の反発は、業績ではなく「株主の取り分が薄まる心配が消えた」という資本の扱い方の話でした。韓国株の値段には、製品の強さとは別に、こうした扱い方への不安（コリア・ディスカウント）が乗っています。</p>
  <div class="me"><span class="k">保有にとって：</span>10/23終値で、MU $876.76（取得単価から-23.0%）、000660 ₩1,277,000（同-30.7%）。000660の予想PERは約2.7倍まで縮みましたが、業績の予想は30日でほぼ横ばい（-0.4%）です。下げの中身は「業績の書き換え」ではなく「値段のつけ方の縮み」です。答えは<b>10/28（水）9:00のSK Hynix決算</b>です。</div>
  <div class="src">出典：ブリーフィング10/24版（ソウル新聞・電子新聞・ファイナンシャルニュース・MBC）・10/21版（CNBC・Korea JoongAng Daily・NewsBytes）・10/15版</div>
</div>

<div class="wave mix">
  <h3>⑥ 政治の季節 ─ 米中間選挙まであと10日</h3>
  <div class="tags"><span>山場：11/3（米中間選挙）</span><span class="s-up">近づいている（あと10日）</span><span>保有には：間接</span></div>
  <div class="num">民主党の支持のリード：Silver Bulletinの平均 <b>+8.9ポイント</b>（10/7）／ロイター・イプソス <b>47%対35%（+12）</b>（10/20、今回の選挙で最大の差）／Pew 44%対36%（10/10ごろ）</div>
  <p><span class="k">10/14版から：</span>10/14版では「今週の平均は未取得」でした。今回は個別の調査で差が広がっていることを確かめました。平均の数字は集計元で+5〜9と割れていて、+5台とする集計もあります。</p>
  <p><span class="k">何が起きている：</span>物価（原油高）への不満が争点です。選挙の直前の時期に、①のイランへの攻撃の判断が「選挙後」に先送りされている形です。</p>
  <p><span class="k">なぜ大事：</span>選挙の結果で、イランへの方針（①）、関税、半導体の輸出規制の方針が変わりうるからです。</p>
  <div class="me"><span class="k">保有にとって：</span>選挙後のイランへの攻撃の観測が、そのまま原油（①）と物価・金利（②）に効きます。中国メモリへの規制の議論（⑦）も、選挙後の方針で動きうる論点です。</div>
  <div class="src">出典：<a href="https://politicalwire.com/2026/10/10/democrats-solidly-ahead-on-generic-ballot/">Political Wire（10/10）</a>・<a href="https://bdnews24.com/world/americas/3z29atb62e">bdnews24（ロイター・イプソス、10/20）</a>・<a href="https://political.org/2026/10/08/is-a-democratic-blue-wave-turning-into-a-midterm-tsunami-new-polling-points-to-a-rout/">political.org（10/8・Silver Bulletin）</a>・<a href="https://plusminus4.substack.com/p/generic-ballot-2026">PlusMinus4（別の集計）</a></div>
</div>

<div class="wave hot">
  <h3>⑦ 中国のAIの自前化 ─ 🆕 HBMにも手が届き始めた（名乗りの段階）</h3>
  <div class="tags"><span>始まり：2023年の輸出規制〜</span><span class="s-up">強まっている</span><span>保有には：逆風（汎用DRAMの値段、将来は中国向けHBM）</span></div>
  <div class="num">CXMTのDRAMシェア 4%（前年）→ 10%（2026年4〜6月、Counterpoint）<br>🆕 HuaweiのAscend 950DT（10〜12月に出る予定）に<b class="down">自社のHBM（HiZQ 2.0）144GB</b>。DeepSeekが年末までにこれで新しいモデルの学習を始める可能性（The Information、10/19〜20）</div>
  <p><span class="k">10/14版から：</span>10/14版では「HBMはまだ3社の世界」と書きました。今週、Huaweiが自前のHBMを積んだチップを年末に出す予定だと報じられ、HBMの側にも中国の影が初めてかかりました。ただし、量も性能も確かめられておらず、<b>名乗りの段階</b>です。CXMTの新しい数字はありません。</p>
  <p><span class="k">何が起きている：</span>DeepSeekが学習（事前学習）までHuaweiのチップで回せるかが焦点です。一方で「重い学習は結局、手に入るNVIDIAで行っている」という慎重な見方もあります。Goldmanは10/16に「中国の脅威は誇張されている」との見方を示しました（24/7 Wall St.の関連記事の見出し）。</p>
  <p><span class="k">なぜ大事：</span>中国の中では「ナンバーワンでなくても足りる」可能性があります。Huaweiのチップが最先端でなくても、中国向けのHBMの需要の一部は3社の外で満たされうる、ということです（推定）。</p>
  <p><span class="k">分かれ目：</span>950DTが年末に実際に出荷され、DeepSeekの学習に使われたと報じられたら本物の変化です。出荷が遅れる、または学習はNVIDIAのまま、なら今回は「名乗り」で終わります。</p>
  <div class="me"><span class="k">保有にとって：</span>当面は汎用DRAMの値段を通した逆風で、HBMについては「中国の中で閉じる需要が少し出るかもしれない」という将来の話です。次の確認は、10/28のSK Hynix決算説明会で、中国（CXMT・Huawei）について何を言うかです。</div>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年10月24日版（クラウドで週次更新・前回は10/14版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
