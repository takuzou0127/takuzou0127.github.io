<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>地元・州の反対</b> → <b>建てる許可が遅れる</b> → GPUでもASICでも、載せる建屋が遅れる</div>
  <div><b>AIの需要</b> → 建てるお金を<b>借りて・株を売って</b>まかなう → <b>金利が高いほど・株価が下がるほど負担が重い</b> → 「払い続けられるか」が問われる</div>
  <div><b>AIの需要</b> → 工場を増やしたい → <b>建屋（クリーンルーム）と部品が足りない</b> → 「作りたくても作れない」</div>
  <div><b>メモリが足りない・高い</b> → PC・スマホの値段が上がる → <b>PC・スマホが売れない</b> → 半導体の別の「客」が傷む</div>
  <div><b>一社・一人への集中</b> → NVIDIAの創業者CEOが辞任 → 「誰が率いるか」で数兆ドルが揺れる → 買い手はNVIDIA以外のチップにも目を向ける</div>
  <div>🆕 <b>中国への規制</b> → 受託製造・後工程の例外が狭まる → 一部の中国の顧客への出荷が止まる（報道） → 規制の網がメモリ・装置に広がるかが次の論点</div>
  <div>この週の変化（解釈）：<b>会社の数字は今週も強く、株価は今週もっとも弱かった</b>週です。NVIDIAの決算（11/17）は売上$1,158億（+103%）、次の見通し$1,300億と予想を上回り、暫定CEOのクレス氏は「メモリと先端パッケージは確保した」と述べました。それでも11/20、SOXは1日で約-9%、KOSPIは-5.2%。理由として報じられたのは、FRBの利上げ（12月の確率97.5%）、中国への新しい規制、AnthropicのIPO後の売り、ファンドの投げ売りで、どれも「メモリが売れない」という数字ではありません。<b>需要の鎖は強まり、お金の値段（金利・株価の倍率）の鎖がそれを上回って効いた</b>週です。</div>
  <div style="font-size:14px;color:#8b93a1">このページは11/21（土）昼に作成。数字はPCの日次ブリーフィング（11/17〜11/21版）の値。米国の11/20は取引中の値（引け前）。</div>
</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave mix">
  <h3>① 戦争と原油 ─ 3週続けて下げ、ブレントは$90割れ</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-dn">弱まっている（11/14版：弱まっている）</span><span>保有には：逆風（弱まる）</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ 約$111（10/29）→ 約$95.84（11/13）→ <b class="down">約$89.7</b>（11/20）／WTI 約$88.56（11/13）→ <b>約$83.1</b>（11/20）</div>
  <p><span class="k">11/14版から：</span>約$95.84 → 約$89.7と、さらに約6%下がった。3週続けての下げで「弱まっている」のまま。開戦前の$72にはまだ戻っていない。</p>
  <p><span class="k">何が起きている：</span>今週、イランをめぐる大きな新しい出来事はPCのブリーフィングでも報じられていない。原油は「ほぼ横ばい」の日が多く、11/20は金・ビットコインと同じく現金化の売りの中にあった。</p>
  <p><span class="k">なぜ大事：</span>原油が下がっても、物価（CPI・PPI）は強く、FRBは利上げに向かっている。原油の重しは軽くなったが、②の金利の重しを外す力にはなっていない。</p>
  <p><span class="k">分かれ目：</span>ホルムズ海峡でのタンカー攻撃が広がるか。イランとの交渉が形になるか。</p>
  <div class="me"><span class="k">保有にとって：</span>今週の保有の大きな下げは、原油では説明できない（原油は下がった）。</div>
  <div class="src">出典：ブリーフィング11/21版（Yahoo 11/21朝のブレント・WTI）・11/14版（The National 11/13）</div>
</div>

<div class="wave hot">
  <h3>② 金利の時代 ─ 10年債は5%を割ったが、12月の利上げは「ほぼ確実」に</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-flat">高止まり（11/14版：強まっている）</span><span>保有には：逆風</span></div>
  <div class="num">米10年債 4.86%（11/6）→ 約5.15%（11/13）→ 5.07%（11/18）→ 5.05%（11/19）→ <b>4.92%</b>（11/20）<br>12月8〜9日のFOMCで利上げの確率 <b class="down">97.5%</b>（CME FedWatch、11/20）／FRBのクック理事「利上げを待ちすぎると後手に回る」（11/20）<br>ドル指数 約103.9（2025年4月以来の高さ）</div>
  <p><span class="k">11/14版から：</span>10年債は約5.15% → 4.92%と下がった。ただしこれは11/20に株から債券へお金が逃げた動きで、FRBの利上げの見方はむしろ固まった（クック理事の発言で確率97.5%）。長い金利は下がり、政策金利は上がる方向。上下が割れたので「強まっている」から「高止まり」にした。</p>
  <p><span class="k">何が起きている：</span>ドルが高く、金・ビットコインは下げ（ビットコインは$59,000割れ、7月以来の安値）。「利子の付かないもの・値段の高いもの」から現金に戻す動き。</p>
  <p><span class="k">なぜ大事：</span>利上げが確実になると、将来の利益に払う倍率（PER）が縮む。今週、メモリ3社の予想PERは2.1〜2.9倍、NVIDIAも7.7倍まで縮んだ。業績予想は上がったまま、倍率だけが縮んだ。</p>
  <p><span class="k">分かれ目：</span>12/8〜9のFOMCで「1回で終わり」と言うか、「さらに上げる」と言うか。</p>
  <div class="me"><span class="k">保有にとって：</span>今週の下げの一番大きな理由の一つ。メモリの軸（売り切れ・価格・設備投資）は無事でも、倍率の縮みで株価は下がる。</div>
  <div class="src">出典：ブリーフィング11/19版（10年債5.07%）・11/21版（Yahooライブ 11/20：クック理事・FedWatch・ドル指数）・11/14版（CNBC 11/13）</div>
</div>

<div class="wave hot">
  <h3>③ AIの足りないもの ─ NVIDIAが「メモリは確保した」。需要の数字はさらに強い</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている（11/14版：強まっている）</span><span>保有には：両方</span></div>
  <div class="num">NVIDIA 8〜10月期：売上 <b>$1,158億</b>（前年比+103%、予想を約+6%）、データセンター $1,076億（+110%）／次の四半期の見通し <b>$1,300億</b>（予想$1,251億、中国向けのデータセンターは0の前提）（11/17）<br>クレス暫定CEO「<b>メモリと先端パッケージは確保した</b>」、供給の約束は$2,790億から増え、主にメモリの分（報道）<br>TrendForce：2027年のHBM4の値段は今年の<b>1.5〜2.7倍</b>の見通し（11/18）<br>逆側：粗利率の見通し 71〜72%（前の四半期74.8%、報道）／ネオクラウドの下げ（11/20：Applied Digital -16%・Nebius -12.5%・CoreWeave -9%超）</div>
  <p><span class="k">11/14版から：</span>CoreWeave・TSMC・AMATに続き、一番大きな買い手のNVIDIAが予想を上回る数字を出し、「メモリを確保した」と言った。足りないもの（メモリ）を前倒しで押さえる動きがさらに強まったので「強まっている」のまま。</p>
  <p><span class="k">何が起きている：</span>粗利率の見通しが約3pt下がるのは、メモリ（HBM）の値上がりで部品代が上がった面もある、と読める（推論・確度 低。会社は理由を分けていない）。一方で、GPUを借りて貸すネオクラウドの株は大きく下げ、AIの資金の出し手への心配も出た。</p>
  <p><span class="k">なぜ大事：</span>メモリにとっては、最大の買い手が「確保した」と言ったこと自体が需要の証拠。ただ、その需要を支える資金（借金・上場で集めたお金）の値段が上がっている。</p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝NVIDIAの数字と言葉、TrendForceの値段の見通し、業績予想の上向き（30日でSK Hynix +15.2%・Samsung +8.2%）。逆＝ネオクラウドの下げ、AnthropicのIPO後の下げ、金利。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル③（設備投資の減額）は点いていない。シグナル②（HBMの値下がり）も逆向き（2027年はさらに値上がりの見通し）。</div>
  <div class="src">出典：ブリーフィング11/19版（NVIDIA 8-K・CNBC・NBC・Filing Insights 11/17〜18）・11/21版（TrendForce 11/18、Yahoo 11/20）</div>
</div>

<div class="wave mix">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ ─ 数字はNVIDIAが強かった週</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-flat">据え置き（11/14版：強まっている）</span><span>保有には：中立〜追い風</span></div>
  <div class="num">NVDA：AVGOの売上の比 約84：16（前回）→ NVIDIAのデータセンターが$1,076億に増え、AVGOの最新（$167億、9月の決算）と並べると<b>約87：13</b>（同じ時期の数字ではない。AVGOの次の決算は12/10）<br>中国向け：NVIDIAのライセンス品（Hopper）の出荷が止まった（前の四半期は$24億、報道）</div>
  <p><span class="k">11/14版から：</span>先週は「CEO辞任の日にAMD・Broadcomが上げた」という値動きで「強まっている」にした。今週は会社の数字（NVIDIAの決算）が出て、NVIDIAの側の伸びが大きかった。比べるAVGOの数字は古いので、比が本当に動いたかは12/10まで分からない。値動きの材料（先週）と数字の材料（今週）が逆を向いたので「据え置き」に戻した。</p>
  <p><span class="k">何が起きている：</span>取締役会のジョーンズ議長は、フアン氏のCEO復帰を考えていないと説明会で明言。AMDは空売り筋の中国をめぐる報告で1週間に約-19%（AMDは否定）。</p>
  <p><span class="k">なぜ大事：</span>どのチップが伸びても、HBMを積む点は同じ。「誰が勝つか」より「全体で何台か」がメモリには効く。</p>
  <p><span class="k">分かれ目：</span>12/10のAVGO決算で、AIの売上と2027年度の目標$1,150億の進み方。</p>
  <div class="me"><span class="k">保有にとって：</span>NVIDIAが強ければSK Hynix（NVIDIA向けHBMの首位）に追い風、ASICが強ければSamsung（Google TPU向け）に追い風。どちらでもメモリは通る構図はそのまま。</div>
  <div class="src">出典：ブリーフィング11/19版（NVIDIA 8-K・NBC 11/18）・11/21版（AMD）・AVGO 9/2決算</div>
</div>

<div class="wave hot">
  <h3>⑤ 一握りの会社に集中する市場 ─ SOXは1日で約-9%、1962年以降で数えるほどの週</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-up">強まっている（下げの方向。11/14版：乱高下）</span><span>保有には：両方</span></div>
  <div class="num">KOSPI 5,290.53（11/13）→ 11/18 +1.99%（NVIDIA決算を好感）→ <b class="down">4,869.96</b>（11/20、-5.21%、1月以来の安値・売りのサイドカー）<br>SOX 11/20 <b class="down">約-9.3%</b>（8,542、取引中）／S&amp;P500は10/6の最高値から約-10%、ナスダック100は-20%に近い<br>Bespoke：1962年以降で同じくらい重い週は約6回（1974・1978・9.11の翌週・2008年10月など）</div>
  <p><span class="k">11/14版から：</span>先週は上下に振れた。今週はNVIDIAの好決算の日（11/18）に韓国が上げた後、11/20に<b>韓国・米国の両方で一方向に大きく</b>下げた。方向がはっきり下になったので「乱高下」から「強まっている（下げの方向）」に変えた。</p>
  <p><span class="k">何が起きている：</span>外国人は韓国株を6日続けて売り越し（6日で約5.1兆ウォン）、SK Hynixの空売りの売買代金は前日の約2.4倍。韓国では個人が約1.6兆ウォン買い越して受けた。米国ではアイブス氏（Wedbush）が「完璧な嵐」として7つの理由を挙げた（民主党の大勝とデータセンター規制の心配、フアン氏の退任、中国の規制、投げ売り、ファンドの損失、粘る物価とタカ派のFRB等）。</p>
  <p><span class="k">なぜ大事：</span>半導体は相場全体の約3倍の速さで落ちた（SOX -9.3%÷S&amp;P -2.8%）。指数を買っても、同じ数社に賭けている状態の怖さが一番出た週。</p>
  <div class="me"><span class="k">保有にとって：</span>11/20時点で、MU $600.14（取得単価から<b>-47.3%</b>、取引中。11/14版は約-32%）、000660 ₩1,113,000（同<b>-39.6%</b>、11/14版は-34.0%）、Samsung ₩183,100（同<b>-36.4%</b>、11/14版は-28.4%）。業績予想は上がったままで、下げの中身は倍率の縮み。安い＝安全ではない点も同じ。</div>
  <div class="src">出典：ブリーフィング11/19版（Newspim・国際ニュース 11/18）・11/21版（Yahoo 11/21朝・Yahooライブ・Bespoke・トップスターニュース・ファイナンシャルニュース 11/20）</div>
</div>

<div class="wave hot">
  <h3>⑥ 政治の季節 ─ 🆕 中国への規制の網が受託製造に広がった</h3>
  <div class="tags"><span>山：12月（フアン前CEOの議会証言）・2027年1月（新議会・米中の休戦期限1/10）</span><span class="s-up">強まっている（11/14版：強まっている）</span><span>保有には：間接〜直接の候補</span></div>
  <div class="num">米国の新しい規則で、受託製造・後工程の会社の例外が狭まり、顧客の確認が増える（TrendForce 11/18）<br>FTの報道として「SamsungとTSMCが一部の中国の顧客への出荷を止めた」（韓国メディアの引用・二次情報、11/20）<br>NVIDIAの見通しは中国向けのデータセンターを0の前提（11/17）／フアン前CEOの議会証言は12月（日付未定）</div>
  <p><span class="k">11/14版から：</span>先週は「NVIDIAの件で議会の輸出規制の議論が強まる恐れ」だった。今週は実際の規則（受託製造の例外の縮小）が動き、出荷停止の報道も出た。恐れが一部、実際の形になったので「強まっている」のまま。</p>
  <p><span class="k">何が起きている：</span>TSMCは11/20に-8.7%。報道の出荷停止はロジック（受託製造）の話で、メモリの出荷の話ではない。</p>
  <p><span class="k">なぜ大事：</span>Samsungは受託製造の部門も持つので、3社の中で規制の例外の縮小を一番受けやすい（PCの11/21版はSamsungの判定を「ややポジティブ」に一段下げた）。</p>
  <div class="me"><span class="k">保有にとって：</span>出荷停止が会社の発表で確かめられ、金額が大きければSamsungには逆風。メモリの出荷まで規制が広がるかが次の分かれ目。</div>
  <div class="src">出典：ブリーフィング11/21版（TrendForce 11/18、トップスターニュース 11/20がFTを引用。FTの記事そのものは未確認）・11/19版（NVIDIA 8-K）</div>
</div>

<div class="wave hot">
  <h3>⑦ 中国のAIの自前化 ─ CXMTの2027年の増産は約20%（TrendForce）</h3>
  <div class="tags"><span>始まり：2023年の輸出規制〜</span><span class="s-flat">据え置き（11/14版：据え置き）</span><span>保有には：逆風の候補</span></div>
  <div class="num">CXMTの2027年の生産能力の増加は<b>約20%</b>（TrendForce 11/18）<br>CXMTのHBM3E：限定生産の計画、歩留まり20〜30%（Reuters 10/28、既報）／比べる側：SK HynixのHBM4の歩留まり70%超（11/12〜13の報道）</div>
  <p><span class="k">11/14版から：</span>新しい数字が1つ出た（CXMTの2027年の増産は約20%）。ただ、これまでの「本格的な増産は2027年」という見方と同じ向きで、強さを変えるほどの変化ではないので「据え置き」。</p>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年11月21日版（クラウドで週次更新・前回は11/14版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
