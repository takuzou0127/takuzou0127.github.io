<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div><b>AIの需要</b> → 建てるお金を<b>借りて</b>まかなう → <b>金利が高いほど負担が重い</b> → 「払い続けられるか」が問われる</div>
  <div><b>AIの需要</b> → 工場を増やしたい → <b>建屋（クリーンルーム）と部品が足りない</b> → 「作りたくても作れない」</div>
  <div>🆕 <b>メモリが足りない・高い</b> → PC・スマホの値段が上がる → <b>PC・スマホが売れない</b> → 半導体の別の「客」が傷む</div>
  <div>この週の変化（解釈）：大手4社の決算がそろい、<b>「いくら買うか」は4社とも2027年に増やす</b>方向でした。それでも株価は「その支出を<b>払い続けられるか</b>」に反応しました（10/29 Alphabet -12.6%）。さらに10/30、Intelが「メモリが足りず高いせいでPCが売れない」と見通しを下げ、半導体指数SOXは1日で-7.2%下げました。メモリの強さ（値上げ力）が、他の会社の業績を通して跳ね返ってくる5本目の鎖です。どれも「AIの需要が減った」話ではない点は、これまでと同じです。</div>
  <div style="font-size:14px;color:#8b93a1">このページは10/31（土）昼に作成。株価は10/30の終値（PCの日次ブリーフィングの値）。</div>
</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave hot">
  <h3>① 戦争と原油 ─ 選挙（11/3）まであと3日、「選挙後」待ち</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-flat">高止まり（10/24版：強まっている）</span><span>保有には：逆風</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ $105台（10/13）→ $114〜116（10/23）→ <b>約$111</b>（10/29、先物BZ=F）／WTI <b>$103.1</b>（10/30）</div>
  <p><span class="k">10/24版から：</span>$114〜116 → 約$111と、少し下がりました。ただし今週はブレントとWTIで方向が割れる日が続き、出所によって値が$109〜115と大きく違います（限月の切り替えの影響の可能性。推定）。上がり続けてはいないが高い所にいる、として「強まっている」から「高止まり」に変えました。</p>
  <p><span class="k">何が起きている：</span>ホワイトハウスは「11/3の選挙前は攻撃を再開しない」としています。一方で、米国とイスラエルが選挙後の共同攻撃の計画を作っているとの報道があり（ABC News）、3つ目の空母打撃群をペルシャ湾方面へ送りました（Japan Times）。トランプ氏はイランとの一時的な和平交渉も続けています（Semafor）。</p>
  <p><span class="k">なぜ大事：</span>原油は物価の土台です。日本では、自民党がガソリン補助を12月から毎月5円ずつ減らす提言案をまとめました（時事）。補助が減ると、原油高がガソリン代に出やすくなります。</p>
  <p><span class="k">分かれ目：</span>11/3の選挙の後に攻撃が実際に起きるかです。起きれば原油は上に跳ねやすく、起きずに交渉が進めば、値段に乗っている「選挙後のリスク」の分がはがれます。</p>
  <div class="me"><span class="k">保有にとって：</span>今週の保有銘柄の大きな上下は、原油では説明できません（③⑤の決算が主因）。原油は②の金利を通して効く、ゆっくりした重しのままです。</div>
  <div class="src">出典：ブリーフィング10/27版（ABC News・Japan Times・The American Conservative・時事）・10/30版（Semafor・ブレント）・10/31版（WTI・The Hill）</div>
</div>

<div class="wave mix">
  <h3>② 金利の時代 ─ 据え置きだが「次は上げ」の声が増えた</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-flat">高止まり（10/24版：弱まっている）</span><span>保有には：逆風</span></div>
  <div class="num">米10年債 5.27%（10/7）→ 約4.98%（10/23）→ 5.05%（10/28）→ <b>4.93%</b>（10/30）／FRB 政策金利 <b>3.75〜4.00%で据え置き</b>（10/28、2人が利上げを主張）／日銀 <b>1.25%で据え置き</b>（10/30、1人が1.5%を主張）</div>
  <p><span class="k">10/24版から：</span>10年債の水準は5%前後で、ほとんど動いていません。変わったのは中央銀行の空気です。FRBは据え置いたものの、2人の委員（クック理事・ハマック総裁）が0.25%の利上げを主張して反対し、市場は12月の利上げを広く予想しています（CNN・NPR）。日銀の植田総裁も12月の利上げに前向きな姿勢をにじませました（Bloomberg）。判定を「弱まっている」から「高止まり」に戻しました。</p>
  <p><span class="k">何が起きている：</span>FRBの声明は「インフレはなお高い」「次の判断は追加の情報で」。ドル円は約157.5円（10/30）で、円安が続いています。</p>
  <p><span class="k">なぜ大事：</span>金利が高いままだと、③の「借りて建てる」AI投資の負担が重くなります。今週、市場が大手の「払い続けられるか」に敏感になったのは、この金利の高さと無関係ではないとみられます（解釈）。</p>
  <div class="me"><span class="k">保有にとって：</span>メモリ株は振れ幅が大きく、金利の不安が強まる日に真っ先に売られやすい側です。次の山は12月のFOMCと日銀会合です。</div>
  <div class="src">出典：ブリーフィング10/29版（FRB声明・CNN・NPR）・10/31版（yfinance・Bloomberg）</div>
</div>

<div class="wave hot">
  <h3>③ AIの足りないもの ─ 「お金」は「払い続けられるか」へ、🆕 メモリ不足が「客」を傷め始めた</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている</span><span>保有には：両方</span></div>
  <div class="num">買う量：大手4社とも<b>2027年の設備投資を増やす</b>方向（Amazon 2026年 約$220B→2027年「大幅増」、Microsoft 暦2027年 約$170B、Alphabet 2027年「大幅増」）<br>払う力：Alphabetのフリーキャッシュフロー <b class="down">-$9.1B</b>（2四半期連続マイナス）→ 株価 <b class="down">-12.6%</b>（10/29、上場来最悪の1日）<br>🆕 Intel「メモリ不足でPCが売れない」→ 10〜12月の売上見通しが予想より約9%低く、株価 <b class="down">-29.3%</b>（10/30）</div>
  <p><span class="k">10/24版から：</span>「お金」の鎖の中身が、「借りられるか」から「<b>稼ぎで払えているか</b>」に移りました。AlphabetもAmazonもフリーキャッシュフローがマイナスで、Metaは株式を発行し（NVDAが$3B出資）、銀行はAnthropic向けのテキサスのデータセンター融資（$15B）の債券売却を棚上げしました（Bloomberg、州が送電網のリスク評価で新規案件を保留）。🆕は「メモリが高すぎて、別の客が困る」という鎖です。</p>
  <p><span class="k">何が起きている：</span>Anthropic（このページを書いているAIの会社）は10/26に上場の目論見書（S-1）を公開し、計算力の支払いの約束が約$542〜567Bと分かりました（Fortune）。7〜9月の売上を年に直した額（約$67B）の約8年分です。数え方によって総額は大きく割れます。メモリの側では、SK Hynixが決算で「顧客の需要は供給の2倍超」「主要顧客14社と5年の長期契約、2027〜28年の生産能力の50%超が埋まった」と説明し（10/28）、Samsungも「メモリの需給は2028年まで逼迫」と述べました。その裏で、Intelは2026年のPC市場を-12%、2027年を-10%と見込み、CEOは「メモリの供給と価格が正常化するまで」この環境が続くと話しました（24/7 Wall St.・CNBC）。</p>
  <p><span class="k">なぜ大事：</span>メモリが足りないことは、MU・SK Hynixにとっては値上げ力そのものです。ただ今週初めて、高いメモリが<b>PC・スマホの需要を削る</b>という裏の面が、他社の決算の数字として出ました。PC向けの比重が大きい銘柄ほど深く売られ（AMD -10.9%・QCOM -11.1%・DELL -10.8%）、PC依存の小さいNVDAは-4.1%で済みました。</p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝4社とも2027年に「もっと買う」と言い、AWSは売上+39.3%（6四半期連続で加速）、受注残$578B。Microsoftの受注残は$677B。逆＝払う力に疑問が出始め、高いメモリが他の需要を削り始めた。どちらも「AIの需要が減った」ではありません。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル③（設備投資の減額）は点いていません。むしろ増える方向です。シグナル②（HBMの値下がり）も、SK Hynixの説明では逆向き（需要が供給の2倍超）です。新しく見るべきなのは、ハイパースケーラーの<b>フリーキャッシュフロー</b>と、PC・スマホの側の需要の削れ方です。</div>
  <div class="src">出典：ブリーフィング10/27版（Fortune・Yahoo Finance）・10/29版（BigGo・Korea JoongAng Daily）・10/30版（CNBC・Fortune・Bloomberg）・10/31版（24/7 Wall St.・CNBC・Amazon IR・Constellation Research）</div>
</div>

<div class="wave mix">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている</span><span>保有には：中立〜追い風</span></div>
  <div class="num">NVDA：AVGOの売上の比 約89：11（1年前）→ <b>約84：16</b>（新しい決算なし。次はNVDA 11/18・AVGO 12/10）<br>AnthropicのS-1の約束：NVIDIA系 <b>約$165B</b> 対 BroadcomのTPUリース <b>約$161B</b>（1社だけの配分）</div>
  <p><span class="k">10/24版から：</span>市場全体の比は変わっていません。新しく、Anthropic 1社の支払いの約束の配分が一次資料（S-1）で分かり、NVIDIA系とTPUがほぼ同じ額でした。ただしこれは自社チップに寄った1社の数字で、市場全体とは比べられません。Google Cloudの売上が2倍（$30.7B）になったことは、TPU（AVGO側）の需要の強さを示します。</p>
  <p><span class="k">何が起きている：</span>S-1の約束の相手は、Broadcom（TPU）・Google・Amazon（Trainium）・NVIDIA系の会社・AMD（MI450）でした。S-1は「ハイパースケーラーは自社を顧客ではなく競合として見るようになっており、計算力の調達が制約される」とも書いています。</p>
  <p><span class="k">なぜ大事：</span>買い手が1社に頼らないほど、チップの横に載るHBMの買い手も散らばります。S-1の約束の相手は、Cerebrasを除けばどれもHBMを積むチップです。</p>
  <div class="me"><span class="k">保有にとって：</span>どのチップが勝ってもHBMは通る、という構図はそのままです。10/30のIntelショックでは、PC向けのチップほど売られ、AIのデータセンター向けのNVDAは下げが最小でした。</div>
  <div class="src">出典：ブリーフィング10/27版（Fortune・The FPS Review）・10/30版（Alphabet決算）・10/31版（騰落）</div>
</div>

<div class="wave hot">
  <h3>⑤ 一握りの会社に集中する市場 ─ 上にも下にも、1日で大きく振れる</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-flat">乱高下（10/24版：弱まっている）</span><span>保有には：両方</span></div>
  <div class="num">KOSPI 5,550（10/23）→ 5,469（10/26）→ <b class="up">+6.63%</b>（10/28）→ 5,937（10/29）→ <b class="down">5,730.74</b>（10/30）<br>SOX 10,758（10/23）→ 11,502（10/29）→ <b class="down">10,690.58</b>（10/30、-7.19%。6/5以来最大の下げ）</div>
  <p><span class="k">10/24版から：</span>逆回転が一方向に進んだ先週と違い、今週は<b>上にも下にも</b>大きく振れました。10/28はSK Hynixの決算でKOSPIが1日+6.63%（2月以来の大幅高）、10/30はIntelショックで-3.48%です。判定を「弱まっている（逆回転）」から「乱高下」に変えました。</p>
  <p><span class="k">何が起きている：</span>SK Hynixの決算（10/28）は、営業利益が予想を8.3%上回り、本株は+10.9%でした。翌日も続伸して、取得単価からの含み損は-27%から-17%に縮みました。ところが10/30には米国のIntelショックで-7.08%と、決算後の戻りをほぼ1日で吐き出しました。MUも10/29から2日で-9.9%です。</p>
  <p><span class="k">なぜ大事：</span>指数を買っても、実は同じ数社に賭けている状態です。その数社の材料（良くても悪くても）が、指数をそのまま大きく動かします。韓国では10/26に外国人が大きく売り越し、10/28には外国人・機関がそろって買い越すなど、資金の向きも日ごとに入れ替わっています。</p>
  <div class="me"><span class="k">保有にとって：</span>10/30終値で、MU $884.97（取得単価から-22.2%）、000660 ₩1,418,000（同-23.1%）。MUの業績予想は上向きのままで、000660の決算もテーゼを支える中身でした。下げの中身は、業績の書き換えではなく「振れ幅の大きい銘柄が、他社のショックでまとめて売られる」形です。</div>
  <div class="src">出典：ブリーフィング10/27版（Korea Times）・10/29版（ad-hoc-news）・10/30版（ad-hoc-news・Benzinga）・10/31版（TradingKey・Benzinga・Korea Times・TokenPost）</div>
</div>

<div class="wave mix">
  <h3>⑥ 政治の季節 ─ 米中間選挙まであと3日、🆕 米中「休戦」の期限11/10</h3>
  <div class="tags"><span>山場：11/3（米中間選挙）・11/10（米中の休戦期限）</span><span class="s-up">近づいている（あと3日）</span><span>保有には：間接</span></div>
  <div class="num">民主党の支持のリード：PollCheckの平均 <b>+8.7ポイント</b>（51.1%対42.4%、10/27）／ロイター・イプソス 53%対44%（10/26、投票に行きそうな人）／NPR・PBS・Marist <b>+8</b>（10/19〜20）</div>
  <p><span class="k">10/24版から：</span>平均は+8〜9ポイントの間で、ほぼ変わっていません。🆕は、米中の「休戦」の期限が11/10に迫っていることです（10/31版）。選挙の1週間後に、半導体の輸出規制・関税に直結する期限が来ます。</p>
  <p><span class="k">何が起きている：</span>物価（原油高）への不満が争点で、選挙の直前の時期に①のイランへの攻撃の判断が「選挙後」に先送りされている形です。</p>
  <p><span class="k">なぜ大事：</span>選挙の結果で、イランへの方針（①）、関税、半導体の輸出規制の方針が変わりうるからです。米中の休戦が切れれば、中国向けの半導体と、中国のメモリ（⑦）への規制の議論が一気に動きます。</p>
  <div class="me"><span class="k">保有にとって：</span>11/3（選挙）→11/10（米中の期限）と、1週間に2つの山が続きます。どちらも保有に直接ではなく、原油・金利・規制を通して効きます。</div>
  <div class="src">出典：<a href="https://www.pollcheck.co.uk/us-midterms-2026/generic-ballot">PollCheck（10/27）</a>・<a href="https://maristpoll.marist.edu/polls/u-s-midterm-elections-october-2026/">Marist（10月）</a>・<a href="https://bdnews24.com/world/ohf47mxqm6">bdnews24（10/27）</a>・ブリーフィング10/30版・10/31版（The Hill）</div>
</div>

<div class="wave hot">
  <h3>⑦ 中国のAIの自前化 ─ 今週は新しい事実なし、3社の「売り切れ」が続く</h3>
  <div class="tags"><span>始まり：2023年の輸出規制〜</span><span class="s-flat">据え置き（新しい材料なし。10/24版：強まっている）</span><span>保有には：逆風の候補</span></div>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年10月31日版（クラウドで週次更新・前回は10/24版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
