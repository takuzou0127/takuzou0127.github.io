<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>地元・州の反対</b> → <b>建てる許可が遅れる</b> → GPUでもASICでも、載せる建屋が遅れる</div>
  <div><b>AIの需要</b> → 建てるお金を<b>借りて</b>まかなう → <b>金利が高いほど負担が重い</b> → 「払い続けられるか」が問われる</div>
  <div><b>AIの需要</b> → 工場を増やしたい → <b>建屋（クリーンルーム）と部品が足りない</b> → 「作りたくても作れない」</div>
  <div><b>メモリが足りない・高い</b> → PC・スマホの値段が上がる → <b>PC・スマホが売れない</b> → 半導体の別の「客」が傷む</div>
  <div>🆕 <b>一社・一人への集中</b> → NVIDIAの創業者CEOが辞任 → <b>「誰が率いるか」で数兆ドルが揺れる</b> → 買い手はNVIDIA以外のチップ（AMD・Broadcom）にも目を向ける</div>
  <div>この週の変化（解釈）：1本目の鎖（原油）はさらに弱まった一方、<b>金利の鎖は逆に強まった</b>。原油が下がっても、10月のCPI・PPIが強く、米10年債は4.86%→5.15%に上がり、12月の利上げは織り込み済みになりました。AIの需要の側は、CoreWeave（受注残$1,325億）・TSMC（10月売上+59.7%）・Applied Materials（売上+53%）と<b>会社の数字は全部強い</b>。それでも株価は、11/12のNVIDIAのフアンCEOの辞任という<b>「一人の人」</b>で大きく揺れました。今週の新しい鎖は、需要の話ではなく「集中のもろさ」の話です。</div>
  <div style="font-size:14px;color:#8b93a1">このページは11/14（土）昼に作成。数字はクラウドの代行ブリーフィング（11/11〜11/14版）と検索で確かめた記事の値。PCの日次更新は11/10夜から止まっている。</div>
</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave mix">
  <h3>① 戦争と原油 ─ 2週続けて下げ、ただしホルムズでのタンカー攻撃が下支え</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-dn">弱まっている（11/7版：弱まっている）</span><span>保有には：逆風（弱まる）</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ 約$111（10/29）→ 約$98（11/6）→ 約$94（11/9）→ <b>約$95.84</b>（11/13）／WTI 約$88.56（11/13）</div>
  <p><span class="k">11/7版から：</span>約$98 → 約$95.84。週で2.5%超の下げで、2週続けての下げ（前の週は約-13%）。数字が下がり続けているので「弱まっている」のまま。</p>
  <p><span class="k">何が起きている：</span>選挙の後、トランプ大統領がイランへの追加攻撃は「まずない」と示し、戦争の再開の不安が後退した（The National 11/13）。11/12には「イランとの合意は要らない、海峡は押さえている」と発言し原油が一時上げた（CNBC 11/12）。一方で、ホルムズ海峡で計400万バレル超を積むタンカーへのイランの攻撃が報じられ、値段の下支えになっている。</p>
  <p><span class="k">なぜ大事：</span>原油は物価の土台。ただ今週は、原油が下がっても物価（CPI・PPI）は強く、金利は上がった。原油だけでは金利の重しを外せない、と分かった週。</p>
  <p><span class="k">分かれ目：</span>ホルムズでのタンカー攻撃が広がるか。イランとの交渉が形になるか。</p>
  <div class="me"><span class="k">保有にとって：</span>原油は追い風の側に回りつつあるが、今週の保有の値動き（NVIDIAの件・金利）には効いていない。</div>
  <div class="src">出典：<a href="https://thenationalnews.com/business/energy/2026/11/13/oil-on-track-to-post-second-weekly-decline-as-trump-eases-fears-of-renewed-war-with-iran">The National 11/13</a>・<a href="https://www.cnbc.com/2026/11/12/oil-prices-jump-after-trump-says-no-iran-deal-needed-weve-got-their-strait.html">CNBC 11/12</a>・<a href="https://www.ttnews.com/articles/oil-prices-mideast-disrupt">Transport Topics（11/13）</a>・ブリーフィング11/7版（11/6の値）</div>
</div>

<div class="wave hot">
  <h3>② 金利の時代 ─ 物価が強く、10年債は5.15%へ。12月の利上げは織り込み済み</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-up">強まっている（11/7版：高止まり）</span><span>保有には：逆風</span></div>
  <div class="num">米10年債 5.27%（10/7）→ 4.93%（10/30）→ 約4.86%（11/6）→ 5.01%（11/10）→ <b class="down">約5.15%</b>（11/13、場中5.174%）<br>10月CPI：前月比 <b>+0.4%</b>（予想+0.3%）、コア +0.3%（予想+0.2%）（11/10）／10月PPI：前月比 +0.3%（予想+0.4%）、前年比 <b>+6.5%</b>（2022年11月以来）（11/13）<br>12/8〜9のFOMC：0.25%の利上げを市場は完全に織り込み</div>
  <p><span class="k">11/7版から：</span>10年債は約4.86% → 約5.15%と約0.3%上がり、5%台に戻った。CPIの上振れで12月の利上げが「確実」と見られるようになった。数字がはっきり上がったので「高止まり」から「強まっている」に変えた。</p>
  <p><span class="k">何が起きている：</span>原油は下がったのに、物価の前年比は高い。金は週で大きく下げた（金利が上がると、利子の付かない金は売られやすい）。</p>
  <p><span class="k">なぜ大事：</span>③の「借りて建てる」AI投資の負担が重くなる。CoreWeaveの一部の社債の利回りは16%超と報じられた（11/10）。金利が高いほど、借金で計算力を前倒しで買う会社が苦しくなる。</p>
  <p><span class="k">分かれ目：</span>12/8〜9のFOMCで利上げの後も「さらに上げる」と言うか。</p>
  <div class="me"><span class="k">保有にとって：</span>メモリ株は予想PERが2〜3倍と低く、金利そのものより「利益が何年続くか」に反応しやすい。ただ、買い手（AIのクラウド）の資金繰りを通じて、遅れて効いてくる。</div>
  <div class="src">出典：<a href="https://www.cnbc.com/2026/11/13/treasury-yields-fed-rates.html">CNBC 11/13</a>・<a href="https://www.cnbc.com/2026/11/12/us-treasurys-bonds-yields.html">CNBC 11/12</a>・<a href="https://www.benzinga.com/markets/equities/26/11/63117496/stock-market-today-hot-cpi-treasury-yields-5-percent-nvidia-slides">Benzinga 11/10</a>・<a href="https://investrade.com/market-review-november-13-2026/">Investrade 11/13</a></div>
</div>

<div class="wave hot">
  <h3>③ AIの足りないもの ─ 会社の数字は全部強い。「借金で買っている」面も見えた</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている（11/7版：強まっている）</span><span>保有には：両方</span></div>
  <div class="num">CoreWeave：7〜9月の売上 <b>$36.6億</b>（+168%）、受注残 <b>$1,325億</b>（6月末 約$1,040億）、見通し引き上げ（11/10）<br>TSMC：10月売上 約<b>5,868.9億台湾ドル</b>（前年比+59.7%）（11/10）<br>Applied Materials：8〜10月の売上 <b>$104.1億</b>（+53%）、11〜1月の見通し $106〜116億（11/12）<br>逆側：CoreWeaveの負債 約$470億、純損失$7.1億、一部の社債利回り16%超（11/10）</div>
  <p><span class="k">11/7版から：</span>先週は「建てる許可」が新しい鎖だった。今週は、その不安を打ち消す<b>会社の数字</b>が3つ続けて出た（買い手のCoreWeave・作る側のTSMC・装置のAMAT）。足りないもの（計算力）を前倒しで買う動きは強まっている。一方で、その買い方が借金頼みであることも数字で見えた。両方とも「強まっている」側の話なので判定は据え置き。</p>
  <p><span class="k">何が起きている：</span>CoreWeaveの決算で「AIの計算力の不足（capacity crunch）」が示され、11/11はMU +11.9%などメモリ株が急伸した。AMATはDRAM向けの装置が大きな柱で、メモリ会社が工場を増やし続けていることを示した。</p>
  <p><span class="k">なぜ大事：</span>足りない間はメモリの値上げ力が続く。ただ、AMATの好決算は「2027年後半に新しい生産能力が増える」（Morgan Stanleyの崖の論拠）の裏付けでもある。<b>今の強さと、将来の供給過剰の種が同じ数字に入っている。</b></p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝3社の数字。逆＝CoreWeaveの借金と金利5%台、州の規制（テキサスの新知事の公約はまだ命令になっていない）。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル③（設備投資の減額）は点いていない。むしろ増える方向。新しく見るのは、GPUクラウドの資金繰り（借りられなくなると注文が急に止まる形の弱さ）。</div>
  <div class="src">出典：<a href="https://www.benzinga.com/markets/prediction-markets/26/11/63169587/ai-memory-stocks">Benzinga 11/11</a>・<a href="https://www.cnbc.com/2026/11/10/coreweave-crwv-q3-earnings-report-2026.html">CNBC 11/10</a>・<a href="https://www.sec.gov/Archives/edgar/data/0001046179/000104617926000796/tsm-revenue20261110.htm">TSMC 月次売上（SEC 6-K）</a>・<a href="https://ir.appliedmaterials.com/news-releases/news-release-details/applied-materials-announces-fourth-quarter-and-fiscal-year-2026">Applied Materials 決算</a>・<a href="https://convergedigest.com/coreweave-q3-2026-earnings-financing-nvidia-backlog/">Converge Digest</a></div>
</div>

<div class="wave hot">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ ─ 🆕 創業者の辞任が「分け合い」を押す</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている（11/7版：据え置き）</span><span>保有には：中立〜追い風</span></div>
  <div class="num">NVDA：AVGOの売上の比 約89：11（1年前）→ <b>約84：16</b>（変化なし。次はNVDA 11/18朝・AVGO 12/10）<br>11/12：NVIDIA <b class="down">-4.34%</b>（CEO辞任）の一方、AMD・Broadcom <b class="up">約+6%</b>／11/9：AMDの第5世代EPYCがGoogleのTPU 8txの機器に採用<br>ASIC（専用チップ）はAIサーバーの出荷の約28%、そのうちGoogle TPUが約65%（Tunguz、2026年の推計）</div>
  <p><span class="k">11/7版から：</span>売上の比はまだ動いていない（決算がないため）。ただ、①NVIDIAの創業者CEOが辞任し、その日にAMD・Broadcomが約+6%と、<b>お金がNVIDIA以外に流れる動き</b>がはっきり出た ②GoogleのTPUの機器の司令塔にAMDのCPUが入った。数字（売上の比）ではなく値動きと契約の話なので確度は低いが、方向がはっきりしたので「据え置き」から「強まっている」に変えた。</p>
  <p><span class="k">何が起きている：</span>11/12、NVIDIAはフアン氏が社長兼CEO・取締役を即日辞任したと届け出た（8-K）。暫定CEOはCFOのクレス氏、取締役会の初の議長にハーベイ・ジョーンズ氏。報道は理由を私生活の問題と、中国の情報機関とのつながりが疑われる人物との関係とする。NVIDIAは2日で時価総額4兆ドルを割った。</p>
  <p><span class="k">なぜ大事：</span>買い手は「一社・一人」に頼るもろさを見た。買い手が分かれるほど、チップの横に載るHBMの買い手も散らばる。</p>
  <p><span class="k">分かれ目：</span>11/18朝のNVIDIA決算（暫定CEOのもとで初めて）で、注文の見通しと経営の継続をどう説明するか。</p>
  <div class="me"><span class="k">保有にとって：</span>どのチップが勝ってもHBMは通る、という構図はそのまま。NVIDIAが減速してもAMD・Google TPUがHBMを積む。ただ、NVIDIAはHBMの最大の買い手なので、移り変わりの間に注文の谷ができないかは11/18で確かめる。</div>
  <div class="src">出典：<a href="https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm">NVIDIA 8-K 11/12</a>・<a href="https://abcnews.com/Business/nvidia-ceo-jensen-huang-resigns-amid-alleged-affair/story?id=138076256">ABC News 11/12</a>・<a href="https://fortune.com/2026/11/12/anthropic-ipo-jensen-huang-resignation-nvidia/">Fortune 11/12</a>・<a href="https://tomtunguz.com/when-the-central-bank-of-ai-changes-chairs">Tomasz Tunguz</a>・ブリーフィング11/10版（AMD EPYC・TipRanks 11/9）</div>
</div>

<div class="wave hot">
  <h3>⑤ 一握りの会社に集中する市場 ─ 上下に大きく振れ、週の終わりは「一人」で下げた</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-flat">乱高下（11/7版：強まっている〈下げの方向〉）</span><span>保有には：両方</span></div>
  <div class="num">KOSPI 5,059.69（11/6）→ 5,018.85（11/9）→ <b class="up">5,239.13</b>（11/10、+4.39%）→ 5,375.36（11/11）→ 5,342.73（11/12）→ <b>5,290.53</b>（11/13）<br>NVIDIA $176.64（11/9）→ $168.37（11/10）→ 反発（11/11）→ $166.19（11/12）→ <b class="down">$162.85</b>（11/13、時価総額4兆ドル割れ）<br>MU：11/11 <b class="up">+11.9%</b> → 11/12 -1.6% → 11/13 約-3.3%（約$772、引け前）</div>
  <p><span class="k">11/7版から：</span>先週は下へ一方向だった。今週はKOSPIが2日で約+7%戻した後に3日続けて下げ、<b>上にも下にも</b>振れた。週の後半の下げは業績ではなく、NVIDIAのCEO辞任（一社・一人への集中）。方向が一方向でなくなったので「強まっている（下げの方向）」から「乱高下」に戻した。</p>
  <p><span class="k">何が起きている：</span>韓国では外国人が11/10・11/11に買い越した後、11/13はSK Hynixを約4,700億ウォン売り、SK Hynixは空売りの残高で1位になった。一方でSamsungは買い越し。同じメモリでも、NVIDIAへの依存の大きさで値動きが分かれ始めた。</p>
  <p><span class="k">なぜ大事：</span>指数を買っても、実は同じ数社に賭けている状態。その数社の一つの「社長」の話が、韓国の指数まで動かした。</p>
  <div class="me"><span class="k">保有にとって：</span>11/13時点で、MU 約$772（取得単価から約-32%、11/7版は-39%）、000660 ₩1,216,000（同-34.0%、11/7版は-38.6%）、Samsung ₩206,000（同-28.4%、11/7版は-34.5%）。週を通すと3つとも少し戻した。業績予想は上向きのままで、下げの中身は期待（倍率）とNVIDIAの話。</div>
  <div class="src">出典：<a href="https://www.seoul.co.kr/news/economy/securities/2026/11/10/20261110500363">ソウル新聞 11/10</a>・<a href="https://www.fnnews.com/news/202611111610379869">파이낸셜뉴스 11/11</a>・<a href="https://www.namdonews.com/news/articleView.html?idxno=929099">남도일보 11/12</a>・<a href="https://view.asiae.co.kr/article/2026111316240367270">아시아경제 11/13</a>・<a href="https://www.stocktitan.net/articles/stock-market-today-live-november-13-2026">StockTitan 11/13</a>・<a href="https://www.fool.com/investing/2026/11/13/why-micron-stock-was-sliding-today/">Motley Fool 11/13</a></div>
</div>

<div class="wave mix">
  <h3>⑥ 政治の季節 ─ 選挙後の州の規制は動きなし、🆕 NVIDIAの件で議会の輸出規制の議論へ</h3>
  <div class="tags"><span>山：11/18（下院委員会の説明要請）・2027年1月（新議会・米中の休戦期限1/10）</span><span class="s-up">強まっている（11/7版：強まっている）</span><span>保有には：間接〜直接の候補</span></div>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年11月14日版（クラウドで週次更新・前回は11/7版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
