<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>地元・州の反対</b> → <b>建てる許可が遅れる</b> → GPUでもASICでも、載せる建屋が遅れる</div>
  <div><b>AIの需要</b> → 建てるお金を<b>借りて・株を売って</b>まかなう → <b>金利が高いほど・株価が下がるほど負担が重い</b> → 「払い続けられるか」が問われる</div>
  <div><b>AIの需要</b> → 工場を増やしたい → <b>建屋（クリーンルーム）と部品が足りない</b> → 「作りたくても作れない」</div>
  <div><b>メモリが足りない・高い</b> → PC・スマホの値段が上がる → <b>PC・スマホが売れない</b> → 半導体の別の「客」が傷む</div>
  <div><b>一社・一人への集中</b> → NVIDIAのCEO辞任（11/12）と復帰（11/23） → 「誰が率いるか」で数兆ドルが揺れる → 復帰そのものが政治の論点になった</div>
  <div><b>中国への規制</b> → 受託製造・後工程の例外が狭まる → 「チップを渡す」から「計算力を貸す」まで網を広げるかの議論へ（Megaspeedの件）</div>
  <div>🆕 <b>「2028年の崖」</b> → 大手証券が2028年の汎用DRAMの値下がりを数字で出す（Goldman：約-19〜20%） → 今の利益が高くても<b>倍率（PER）が縮む</b> → 業績予想が上がっても株価が上がりにくい</div>
  <div>この週の変化（解釈）：<b>会社の数字は出ず、値動きと「先の年の見方」が動いた</b>週です。11/22にGoldmanが2028年の崖を数字にし、11/23にNVIDIAはフアン氏をCEOに戻し、SOXは日ごとに+13%・-8%と振れて、週では約+9%（11/20の約8,408→11/27の9,186.71）。11/27は韓国で外国人が2社を8,207億ウォン買い越しました。<br>⚖ ＋：業績予想は上がり続け（30日でSK Hynix +14.6%・Samsung +6.9%）、TrendForceは2027年もDRAMのひっ迫が続く見通し、外国人の買い戻し（1日だけ）。−：2028年の崖の予想、NVIDIAの会計の調査、原油の再上昇、12月の利上げの織り込み約98%。<br>🧭 メモリへの風向き（週の総合）：<b>中立（確度 低）</b>。重みの一番重い会社の数字が今週は出ず、＋は値動き・売買、−は専門家の予想が中心で、どちらも決め手にならない。<b>変わる条件</b>：11月の契約価格（11月末〜12/1頃）が上がればややポジティブ、下がればややネガティブ。</div>
  <div style="font-size:14px;color:#8b93a1">このページは11/28（土）昼にクラウドで作成。数字はPCの日次ブリーフィング（11/22〜11/28版）の値。原油の11/27の確定値は未取得（報道の幅）。</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave hot">
  <h3>① 戦争と原油 ─ ホルムズ海峡で機雷・製油所への攻撃、4週ぶりに上げへ</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-up">強まっている（11/21版：弱まっている）</span><span>保有には：逆風</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ 約$95.84（11/13）→ 約$89.7（11/20）→ <b class="up">約$93〜97</b>（11/25〜27、報道で幅あり。11/27の確定値は未取得）</div>
  <p><span class="k">11/21版から：</span>3週続けて下げていたが、今週は上げに転じた。ホルムズ海峡の東でタンカーが機雷に触れ（イラン軍の発表）、サウジの製油所も攻撃されたとの報道。下げの流れが止まったので「弱まっている」から「強まっている」に変えた。</p>
  <p><span class="k">何が起きている：</span>米国とイランの合意への期待がしぼんだと報道。ただ、機雷の件はイラン側の発表が元で、独立した確認は少ない。</p>
  <p><span class="k">なぜ大事：</span>原油が上がると物価が下がりにくく、②の利上げの見方を後押しする。</p>
  <p><span class="k">分かれ目：</span>タンカーの通航が戻るか、攻撃が続くか。$100を超えるか。</p>
  <div class="me"><span class="k">保有にとって：</span>直接ではなく、金利を通した間接の逆風。今週の株価の振れは原油より、NVIDIAと2028年の見方で説明される。</div>
  <div class="src">出典：ブリーフィング11/27版（PCのニュース版：ブレント約$96.57）・Sabq（ブレント$93.3、11月の水曜）・11/21版（Yahoo 11/21朝）</div>
</div>

<div class="wave hot">
  <h3>② 金利の時代 ─ 12月の利上げの織り込みは約98%、GDPは上方修正</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-flat">高止まり（11/21版：高止まり）</span><span>保有には：逆風</span></div>
  <div class="num">米10年債 4.92%（11/20）→ 約4.91%（11/24）→ <b>約4.82〜4.85%</b>（11/25、Yahoo）<br>12月8〜9日のFOMCで0.25%の利上げの織り込み <b class="down">約98%</b>（11/25）／7〜9月GDP確報値 年率<b>+4.3%</b>（速報3.4%）</div>
  <p><span class="k">11/21版から：</span>長い金利は少し下がり、政策金利の利上げの見方はさらに固まった（97.5%→約98%）。上下が割れたまま、どちらにも大きく動いていないので「高止まり」のまま。</p>
  <p><span class="k">何が起きている：</span>景気が強い（GDPの上方修正）ので、FRBが利上げをためらう理由が少ない。新しい関税案（最大20%）でも「高い金利が長く続く」との見方が出た。</p>
  <p><span class="k">なぜ大事：</span>利上げが確実なほど、将来の利益に払う倍率が縮む。今週の🆕「2028年の崖」と重なると、倍率はさらに縮みやすい。</p>
  <p><span class="k">分かれ目：</span>12/8〜9のFOMCで「1回で終わり」か「さらに上げる」か（結果は日本時間12/10未明）。</p>
  <div class="me"><span class="k">保有にとって：</span>韓国2社の予想PERは約2.1〜2.3倍まで縮んだまま。メモリの軸が無事でも、倍率の側の重しは外れていない。</div>
  <div class="src">出典：ブリーフィング11/25版（Yahoo：10年債・FedWatch）・11/26版（Yahoo 11/25：GDP確報値・10年債）・11/27版（CNN 11/25：関税）</div>
</div>

<div class="wave mix">
  <h3>③ AIの足りないもの ─ 需要の数字は強いまま、論点は「山はいつか」へ</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-flat">高止まり（強いまま。11/21版：強まっている）</span><span>保有には：両方</span></div>
  <div class="num">TrendForce：2027年のDRAMの売上は予想を下げても<b>約1.15兆ドル</b>（前年比+69%）、2027年のHBM4の値段は1ギガビット<b>$3〜5.5</b>（今年の約$2.05から上げ）（二次情報）<br>TrendForceのDRAMの契約価格の道筋：10〜12月 <b>+10〜15%</b> → 2027年1〜3月 +5〜10% → 4〜6月 +3〜8% → 7〜12月 <b>0〜5%</b>（二次情報）<br>逆側：Goldman（11/22付）2028年の汎用DRAM <b class="down">約-19〜20%</b>、2028年の営業利益予想 SK Hynix -23%・Samsung -26%</div>
  <p><span class="k">11/21版から：</span>先週はNVIDIAの決算と「メモリは確保した」で需要の側がはっきり強まった。今週は会社の数字が出ず、出たのは見通し（TrendForce・Goldman）。どちらも「2027年は強い、上げ幅は縮む」で一致し、違いは2028年に下がるか。新しく強まった材料も弱まった材料もないので「強まっている」から「高止まり」にした。</p>
  <p><span class="k">何が起きている：</span>11/22に「DRAMの値段の山は2027年」との見方を、大手の証券会社が年と幅の数字で出した。業績予想は上がり続けているのに、株価が「その先」を値付けしている。</p>
  <p><span class="k">なぜ大事：</span>足りない（売り切れ）が続くかどうかより、「いつ足りるようになるか」が値段を決める段階に入った。</p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝SK Hynix「2029年まで売り切れ」（10/28）・Samsung「2027年分のHBMは売り切れ」（10/29）、TrendForceの2027年の見通し、業績予想の上向き。逆＝Goldman・Morgan Stanleyの2028年の予想、TrendForceの「上げ幅は四半期ごとに縮む」「スマホ向けの交渉が止まっている」（11/18）。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル②（HBMの値下がり）・③（設備投資の減額）は未点灯。次の答えは11月の契約価格（11月末〜12/1頃）と、1/27頃の決算での2028年分の受注。</div>
  <div class="src">出典：ブリーフィング11/26版（The Inference・TechTimes：TrendForceの二次情報。一次資料は未確認）・11/24版（Seoul Economic Daily・Longbridge：Goldman）・11/28版（TrendForce 11/18の週報）</div>
</div>

<div class="wave mix">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ ─ 数字の更新は12/11のAVGO待ち</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-flat">据え置き（11/21版：据え置き）</span><span>保有には：中立〜追い風</span></div>
  <div class="num">NVDA：AVGOの売上の比 暫定 <b>約87：13</b>（NVIDIA 11/17の決算・AVGO 9月の決算。同じ時期の数字ではない）<br>NVDA $125.53（11/21、1週間で-14%）→ <b>$150.49</b>（11/27）／AVGO $304.41（11/21）→ <b>$312.34</b>（11/27）</div>
  <p><span class="k">11/21版から：</span>会社の数字は出ていない。NVIDIAの売上の数字そのものにSECの調査の報道がある（下の⑥）ので、比の分子に注意書きが付いた。比を取り直すのは12/11朝（米国12/10）のAVGO決算で、それまで「据え置き」。</p>
  <p><span class="k">何が起きている：</span>NVIDIAのCEO復帰の後も株の戻りは鈍く（11/27は+0.8%、AMD +4.6%・AVGO +3.8%）、アナリスト目標までの上昇率では一時AVGOがNVIDIAを上回った（値動きの材料）。</p>
  <p><span class="k">なぜ大事：</span>どのチップが伸びても、HBMを積む点は同じ。「誰が勝つか」より「全体で何台か」がメモリには効く。</p>
  <p><span class="k">分かれ目：</span>12/10のAVGO決算で、AIの売上と2027年度の目標$1,150億の進み方。</p>
  <div class="me"><span class="k">保有にとって：</span>NVIDIAが強ければSK Hynix（NVIDIA向けHBMの首位、約2/3〜70%）、ASICが強ければSamsung（Google TPU向け60%超、報道）に追い風。どちらでもメモリは通る構図はそのまま。</div>
  <div class="src">出典：ブリーフィング11/22版・11/28版（Yahoo 11/27終値）・NVIDIA 8-K（11/17）・AVGO 9月決算</div>
</div>

<div class="wave hot">
  <h3>⑤ 一握りの会社に集中する市場 ─ 1日で±6〜13%、週ではSOX約+9%</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-flat">乱高下（11/21版：強まっている〈下げの方向〉）</span><span>保有には：両方</span></div>
  <div class="num">KOSPI 4,869.96（11/20）→ 4,708.54（11/23、-3.31%）→ 5,006.03（11/24、+6.32%）→ 4,697.51（11/25、-6.16%）→ 4,711.21（11/26）→ <b class="up">4,915.68</b>（11/27、+4.34%）<br>SOX 約8,408（11/20）→ 11/24 -7.88%・11/25 -0.65% → <b class="up">9,186.71</b>（11/27、+4.69%）／S&amp;P500は2025年4月以来の良い週</div>
  <p><span class="k">11/21版から：</span>先週は一方向の下げだった。今週は韓国が1日で+6%と-6%を繰り返し、方向がはっきりしない。週では戻したが、日々の振れはむしろ大きい。「下げの方向」から「乱高下」に変えた。</p>
  <p><span class="k">何が起きている：</span>11/23は韓国の寄り付き前の気配が約-5.8%、政府が株価安定基金の準備を表明して戻した。11/27は米国の休場の日に、外国人が韓国株を約1.13兆ウォン買い越し、うちSamsung 4,424億・SK Hynix 3,783億で1・2位。報道の説明は「下げすぎの買い戻し」。</p>
  <p><span class="k">なぜ大事：</span>同じ数社に指数ごと賭けている状態なので、NVIDIA一社の話（CEO・SEC）で韓国のメモリ株が1日に5〜10%動く。外国人の買いが1日で終わるか続くかが、来週の見どころ。</p>
  <div class="me"><span class="k">保有にとって：</span>MUは11/24に$642.76で売却済み（11/27は$646.95）。11/27時点で、000660 ₩1,110,000（取得単価から<b>-39.8%</b>、11/21版は-39.6%）、Samsung ₩179,100（同<b>-37.8%</b>、11/21版は-36.4%）。週の振れの割に、1週間前とほぼ同じ所にいる。</div>
  <div class="src">出典：ブリーフィング11/24〜11/28版（報道・Yahoo、fnnews・JKN 11/27、OnInvest・TradingKey 11/27）</div>
</div>

<div class="wave hot">
  <h3>⑥ 政治の季節 ─ NVIDIAのCEO復帰が与党からも批判され、調べる側が増えた</h3>
  <div class="tags"><span>山：12月（議会の公聴会）・2027年1月（新議会・米中の休戦期限1/10）</span><span class="s-up">強まっている（11/21版：強まっている）</span><span>保有には：間接〜直接の候補</span></div>
  <div class="num">NVIDIAの取締役会がフアン氏をCEO・取締役に復帰（8-K 11/23）。ホワイトハウス・共和党の上院議員からも批判、中国向けのAIチップの販売を法律で縛れとの声（11/25夜）<br>調べる側：SEC（会計、Reuters 11/21）・カリフォルニア州の司法長官（11/21夜）・司法省（Megaspeedの件の報道）<br>新しい関税（最大20%、14か国・地域、早くて2027年1月）は<b>半導体を対象外</b>（232条の別枠）。「過剰生産」の301条（韓国・日本を含む16か国）は正式発表なし</div>
  <p><span class="k">11/21版から：</span>先週は「受託製造の例外の縮小」という規則が動いた。今週はNVIDIAの復帰が政治の論点になり、調べる機関が増えた。新しい関税で半導体は外れたが、301条の火種は残る。強まる材料が続いたので「強まっている」のまま。</p>
  <p><span class="k">何が起きている：</span>シンガポールのネオクラウドMegaspeedが、マレーシア・インドネシアのデータセンターから中国の顧客に計算力を貸していた疑い（NVIDIA・Megaspeedは否定、NYT経由の二次情報）。11/24〜26の半導体の下げの理由として、NVIDIAのチップの売り手がネオクラウドに「中国企業へ計算力を貸すとチップを受け取れなくなる」と警告したとの報道が挙げられた。</p>
  <p><span class="k">なぜ大事：</span>規制が「計算力を貸す」まで届けば、NVIDIAの売り先が絞られ、HBMの需要に小さな逆風（推論・確度 低）。半導体が関税の対象外になったのは韓国2社には＋。</p>
  <div class="me"><span class="k">保有にとって：</span>今週の新しい材料は主にNVIDIAの側。韓国2社の直接の材料は301条の行方（正式発表待ち）と、先週の出荷停止の報道（会社の発表では未確認のまま）。</div>
  <div class="src">出典：ブリーフィング11/22版（Reuters・カリフォルニア州）・11/24版（NVIDIA 8-K 11/23）・11/26版（CNN・Yahoo 11/25：関税）・11/27版（議員の批判）・11/28版（Megaspeed・TradingKey・Seeking Alpha 11/27）</div>
</div>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年11月28日版（クラウドで週次更新・前回は11/21版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
