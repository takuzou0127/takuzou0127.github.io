<div class="sub" id="src">読み込み中…</div>

<h2>流れ同士のつながり</h2>
<div class="chain">
  <div><b>戦争</b> → <b>原油高</b> → 物価が下がらない → <b>金利が上がる</b> → 高PERの株（ハイテク）に重し</div>
  <div><b>AIの需要</b> → データセンター建設 → <b>電気が足りない</b> → 据え付けが遅れる → チップの出荷の時期がずれる</div>
  <div>🆕 <b>AIの需要</b> → データセンター建設 → <b>地元・州の反対</b> → <b>建てる許可が遅れる</b> → GPUでもASICでも、載せる建屋が遅れる</div>
  <div><b>AIの需要</b> → 建てるお金を<b>借りて</b>まかなう → <b>金利が高いほど負担が重い</b> → 「払い続けられるか」が問われる</div>
  <div><b>AIの需要</b> → 工場を増やしたい → <b>建屋（クリーンルーム）と部品が足りない</b> → 「作りたくても作れない」</div>
  <div><b>メモリが足りない・高い</b> → PC・スマホの値段が上がる → <b>PC・スマホが売れない</b> → 半導体の別の「客」が傷む</div>
  <div>この週の変化（解釈）：11/3の米中間選挙で民主党が上下両院の多数を取る見通しになり（AP予測）、原油は下がりました（1本目の鎖は弱まる方向）。代わりに、テキサス州で「データセンター開発の即時停止」を公約した知事が当選し、<b>「建てる許可」</b>が新しい鎖として加わりました。11/4は建設・冷却の銘柄、11/5は半導体全体が売られ、SOXは1日で約-12%（2020年以来最悪）。それでも、<b>契約（売り切れ）・価格・設備投資の3つの数字は、今週どれも変わっていません</b>。下げたのは「建てられないかもしれない」の値付けで、「需要が減った」という数字ではない点は、これまでと同じです。</div>
  <div style="font-size:14px;color:#8b93a1">このページは11/7（土）昼に作成。株価はPCの日次ブリーフィングの値（韓国は11/6の確定値、米国は11/6の引け約1時間前の値）。</div>
</div>

<h2>いま動いている7つのうねり</h2>

<div class="wave mix">
  <h3>① 戦争と原油 ─ 選挙のあと、原油は$90台へ下がった</h3>
  <div class="tags"><span>始まり：2026年2月末</span><span class="s-dn">弱まっている（10/31版：高止まり）</span><span>保有には：逆風（弱まる）</span></div>
  <div class="num">ブレント原油 <b>約$72</b>（開戦前・2/27）→ 最高 <b>$126</b>（4/30）→ 約$111（10/29）→ 約$104（11/3、場中）→ <b class="down">約$93.5〜97</b>（11/4〜5）→ <b>約$98</b>（11/6）／WTI $103.1（10/30）→ <b class="down">約$88.5</b>（11/4、場中-約8%）</div>
  <p><span class="k">10/31版から：</span>ブレントは約$111 → 約$98と、1週間で1割以上下がりました。「選挙後に攻撃が再開するか」という分かれ目は、11/2夜の限定的な攻撃（下）だけで、大規模な戦闘の再開にはなっていません。数字が下がったので「高止まり」から「弱まっている」に変えました。ただし開戦前（$72）よりはまだ高い所です。</p>
  <p><span class="k">何が起きている：</span>米軍は11/2夜にホルムズ海峡のゲシュム島を限定的に攻撃しました。米当局者は「防衛的な措置で、戦闘の再開ではない」と説明し、イランは交渉の継続を認めています（CNN・CNBC・ABC、11/3）。11/4、民主党の勝利の見通しが出ると原油は急落し、Bloombergは「戦争への反対が際立ったため」と説明しました（抜粋のみ確認）。11/5は「イランとの合意は本当か」という疑いで約$97に戻しています。</p>
  <p><span class="k">なぜ大事：</span>原油は物価の土台で、②の金利を通じて高PER株の重しになります。原油が下がれば、その重しは軽くなる方向です。</p>
  <p><span class="k">分かれ目：</span>イランとの交渉が実際の合意になるか。もう一つは11/10〜11のウクライナ・ロシアの協議（アブダビ）です。</p>
  <div class="me"><span class="k">保有にとって：</span>今週の大きな下げは、原油では説明できません（原油は下がったのに、半導体は大きく下げた）。原油は追い風の側に回りつつありますが、効き方はゆっくりです。</div>
  <div class="src">出典：ブリーフィング11/4版（CNN・CNBC・ABC 11/3、yfinance）・11/5版（FinanceFeeds・Bloomberg抜粋 11/4）・11/6版（11/5のブレント）・11/7版（11/6の値）</div>
</div>

<div class="wave mix">
  <h3>② 金利の時代 ─ 米国は少し下がったが、世界では「利上げ」が続く</h3>
  <div class="tags"><span>始まり：2026年夏〜</span><span class="s-flat">高止まり（10/31版：高止まり）</span><span>保有には：逆風</span></div>
  <div class="num">米10年債 5.27%（10/7）→ 4.93%（10/30）→ 約4.95%（11/3）→ 約4.89%（11/4）→ 約4.83%（11/5）→ <b>約4.86%</b>（11/6）<br>今週の利上げ：オーストラリア <b>4.85%</b>（今年5回目、11/3）／イングランド銀行 <b>4.00%</b>（+0.25%、11/5）<br>FRB 3.75〜4.00%（10/28据え置き。次は12/8〜9）</div>
  <p><span class="k">10/31版から：</span>米10年債は4.93% → 約4.86%と、わずかに下がりました。下がった理由の一つは、11/5の株の急落でお金が債券に逃げたこととみられます（解釈・確度 中）。一方で、オーストラリアとイギリスが今週利上げしており、「各国はまだ上げている」という空気は変わっていません。動きが小さいので「高止まり」のままです。</p>
  <p><span class="k">何が起きている：</span>米国の雇用の数字は強めです（9月の求人750万件で予想710万件超、10月のADP +8.6万人で予想+7.5万人超）。11/6予定の10月の雇用統計の数字は、PCのブリーフィングでも確認できていません。</p>
  <p><span class="k">なぜ大事：</span>金利が高いままだと、③の「借りて建てる」AI投資の負担が重くなります。ただ今週、社債の市場は落ち着いていて（S&Pグローバル、11/6）、株の値付けの見直しが借金の不安までは広がっていません。</p>
  <div class="me"><span class="k">保有にとって：</span>次の山は12月のFOMC（12/8〜9）と日銀会合です。今週の保有の下げの主因は金利ではありません（③⑥）。</div>
  <div class="src">出典：ブリーフィング11/4版（Yahoo Finance・CNBC 11/3）・11/5版（ADP 11/4）・11/6版（イングランド銀行 11/5）・11/7版（Benzinga 11/6）</div>
</div>

<div class="wave hot">
  <h3>③ AIの足りないもの ─ 「電気」「お金」に、🆕「建てる許可」が加わった</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-up">強まっている（10/31版：強まっている）</span><span>保有には：両方</span></div>
  <div class="num">🆕 建てる許可：2026年4〜6月に少なくとも<b>45件・$680億</b>の案件が地元の反対で影響（Data Center Watch）／テキサス州の新知事が<b>「データセンター開発の即時停止」</b>を公約して当選（11/3）<br>11/4の下げ：Modine <b class="down">-25%</b>・Sterling <b class="down">-21%</b>・CoreWeave <b class="down">-10%</b>・Vertiv／GE Vernova 約<b class="down">-11〜12%</b><br>買う量（変化なし）：2026年の4社合計 約$7,200〜7,450億、2027年は「大幅増」（Alphabet）、Evercore・BofAは2027年 合計<b>1兆ドル超</b>を予想</div>
  <p><span class="k">10/31版から：</span>「足りないもの」に、<b>建てる場所の許可</b>が加わりました。お金（買い手の設備投資）の数字は変わっておらず、どの大手も計画を下げていません。変わったのは「建てられるか」の方です。新しい鎖が増えたので「強まっている」のままです。</p>
  <p><span class="k">何が起きている：</span>テキサスの新知事（ヒノホサ氏）の公約に加え、サンダース上院議員は全国での停止を主張しています（CNBC・Benzinga、11/5〜6）。ただし<b>実際の州の命令はまだ出ていません</b>（公約の段階）。お金の側では、Anthropic（このページを書いているAIの会社）の改訂S-1で、9/30時点の購入約束とリースが約<b>$8,954億</b>、うち約$2,138億に解約権などの条件が付くと分かりました（FinanceFeeds、11/3ごろ）。10/31版の「約$542〜567B」とは数え方が違い（リースを含むか等）、同じ物差しでは比べられません。11/6には、Anthropicの上場の日程と評価額（1.5兆ドル）に投資家が疑問を持っているとReutersが報じました。</p>
  <p><span class="k">なぜ大事：</span>建屋が遅れると、GPUでもASICでも、そこに載るHBMの出荷の時期がずれます。逆に言えば、許可の問題は「需要が消える」ではなく「時期がずれる」話です（解釈・確度 中）。</p>
  <p><span class="k">支える材料と逆の材料：</span>支え＝設備投資の計画の下方修正は1社もない。社債の市場は落ち着いている。Riotは拠点をAI企業に15年・約$280億で貸す契約（11/4）。逆＝州の規制の不安、Anthropicの上場の遅れの可能性、AI大手の資金の集め方が厳しくなれば来年以降の追加の発注の大きさに効く（推論・確度 低）。</p>
  <div class="me"><span class="k">保有にとって：</span>テーゼ崩れのシグナル③（設備投資の減額）は点いていません。見る順番は、①州の実際の命令、②NVDA決算（日本時間11/18朝）で建設の遅れに触れるか、③メモリの長期契約の見直しの報道、の3つです。</div>
  <div class="src">出典：ブリーフィング11/4版（FinanceFeeds）・11/5版（StockTitan・Motley Fool・Yahoo Finance 11/4）・11/6版（Yahoo Finance 11/5、datacentres.com）・11/7版（CNBC・Benzinga 11/5〜6、Reuters 11/6）</div>
</div>

<div class="wave mix">
  <h3>④ AIチップの「NVIDIA一択」が終わり、分け合う時代へ ─ 今週は新しい数字なし</h3>
  <div class="tags"><span>始まり：2025年〜</span><span class="s-flat">据え置き（新しい数字なし。10/31版：強まっている）</span><span>保有には：中立〜追い風</span></div>
  <div class="num">NVDA：AVGOの売上の比 約89：11（1年前）→ <b>約84：16</b>（変化なし。次はNVDA 11/18朝・AVGO 12/10）<br>今週の下げ：NVDA 約-9.3%（11/5）→ +3.3%（11/6、引け前）／AVGO 約-8%（11/5）→ +0.3%（11/6、引け前）</div>
  <p><span class="k">10/31版から：</span>比を動かす決算は今週ありませんでした。11/5は両社とも約-8〜9%で同じように下げ、比を動かす材料ではありません。決まりどおり、判定は「据え置き」にしています。</p>
  <p><span class="k">何が起きている：</span>NVIDIAがクラウド事業者に「中国以外への販売を51%以上に」と求めたとFTが報じました（NVIDIAは認めも否定もしていない、AFP経由・11/3ごろ）。11/6の戻りはAMD +10%が最大で、AVGOは戻りに乗れませんでした（固有の材料は確認できず）。</p>
  <p><span class="k">なぜ大事：</span>買い手が1社に頼らないほど、チップの横に載るHBMの買い手も散らばります。そして③の「建てる許可」は、GPUかASICかに関係なく両方に同じように効きます。</p>
  <div class="me"><span class="k">保有にとって：</span>どのチップが勝ってもHBMは通る、という構図はそのままです。次に比が動くのはNVDA決算（11/18朝）です。</div>
  <div class="src">出典：ブリーフィング11/4版（France 24／AFP）・11/6版（11/5の騰落）・11/7版（11/6の騰落、NVDA直近決算・AVGO 9/2決算）</div>
</div>

<div class="wave hot">
  <h3>⑤ 一握りの会社に集中する市場 ─ 下へ大きく振れ、韓国は最高値の半分強に</h3>
  <div class="tags"><span>始まり：2023年〜</span><span class="s-up">強まっている（下げの方向。10/31版：乱高下）</span><span>保有には：両方</span></div>
  <div class="num">SOX 11,502（10/29）→ 10,690.58（10/30）→ 4月以来の安値（11/2）→ <b class="down">約-12%</b>（11/5、2020年以来最悪の1日）→ <b>9,361.22</b>（11/6、+3.89%・引け前）<br>KOSPI 最高値 9,114.55（6/22）→ 5,730.74（10/30）→ 5,383.80（11/5、-5.28%）→ <b class="down">5,059.69</b>（11/6、-6.02%・2月以来の5,000割れ水準）</div>
  <p><span class="k">10/31版から：</span>先週の「上にも下にも」から、今週は<b>下へ大きく</b>振れました。11/6、KOSPIは寄り付きの3分後に-8.5%で取引が20分止まり（サーキットブレーカー、今年11回目）、最高値の約54%の水準です。振れ幅も方向もはっきり大きくなったので「乱高下」から「強まっている（下げの方向）」に変えました。</p>
  <p><span class="k">何が起きている：</span>11/5の米国はAMD -約17%・MU -17.5%・NVDA -9.3%。11/6の米国は「救済の戻り」で、韓国はその前夜の米国の下げを後から払いました（時差。解釈・確度 高）。KOSPIの約半分がSK HynixとSamsungの2社で、外国人は11/6に約2.77兆ウォン売り越し、国内の機関は約1.70兆ウォン買い越しました。Meritz証券のイ・ジヌ氏は「長期の資金はほぼ抜け、国民年金も外国人の売りを吸収しきれない」と話しています（JoongAng Daily、11/6）。</p>
  <p><span class="k">なぜ大事：</span>指数を買っても、実は同じ数社に賭けている状態です。米国の1日の不安が、時差をおいて韓国で2度目の値段を付けられ、それが指数をそのまま大きく動かします。</p>
  <div class="me"><span class="k">保有にとって：</span>11/6時点で、MU $689.15（取得単価から<b>-39.4%</b>、10/31版は-22.2%）、000660 ₩1,132,000（同<b>-38.6%</b>、10/31版は-23.1%）、Samsung ₩188,700（同<b>-34.5%</b>）。一方で業績予想は30日で000660 +13.4%・Samsung +9.5%と上がり続け、予想PERは2.1倍・2.4倍まで縮みました。下げの中身は業績の書き換えではなく、期待（倍率）の縮みです。安い＝安全ではない点も同じです。</div>
  <div class="src">出典：ブリーフィング10/31版（10/30の値）・11/3版（CNBC・Yahoo Finance 11/2）・11/6版（yfinance 11/5）・11/7版（Yahoo Finance・JoongAng Daily・BigGo Finance 11/6、yfinance）</div>
</div>

<div class="wave mix">
  <h3>⑥ 政治の季節 ─ 選挙は民主党、論点は「議会」より「州」へ</h3>
  <div class="tags"><span>山：11/3（米中間選挙）→ 次は州の措置・2027年1月の新議会</span><span class="s-up">強まっている（選挙後、州の規制の話へ。10/31版：近づいている）</span><span>保有には：間接〜直接の候補</span></div>
  <div class="num">結果：APの予測で<b>民主党が上下両院の多数</b>（下院は少なくとも245議席の予測、CNBC。上院の最終議席は未確定）／新しい議会は<b>2027年1月</b>から<br>選挙前の予想市場：民主党の両院制覇 76%（Polymarket、11/3朝）</div>
  <p><span class="k">10/31版から：</span>選挙が終わり、世論調査どおり民主党が勝つ見通しになりました。法案にはトランプ大統領の署名が要り拒否権があるため、議会発の規制は当面進みにくいとの見方が多い一方（Yahoo Finance・BigGo）、テキサス州の新知事のように<b>州のレベル</b>でデータセンターの停止を掲げる動きが出ました。政治が③の「建てる許可」を通して、半導体に直接に近い形で効き始めたので「強まっている」にしました。</p>
  <p><span class="k">⚠ 10/31版の訂正：</span>10/31版で「米中の休戦の期限は11/10」と書きましたが、<b>この期限は9/23にすでに2027年1月10日まで延長されていました</b>（ベッセント財務長官の発表、Bloomberg Government・SCMP・Supply Chain Dive など。中国側も延長を確認）。今週の山として書いたのは誤りでした。PCのブリーフィングは11/10を「レアアース規制の一時停止の期限」としていますが、別の期限が残っているかは確認できていません（未取得）。</p>

<script>
// ブリーフィングに「時代のうねり」の節（id="currents"）があればそれを出し、無ければこのページに書いた版を出す
(function(){
  var base = document.getElementById('base').content.cloneNode(true);
  var body = document.getElementById('body');
  var src = document.getElementById('src');
  var BASE_DATE = '2026年11月7日版（クラウドで週次更新・前回は10/31版）';
  function showBase(){
    body.innerHTML = '';
    body.appendChild(base);
    src.textContent = BASE_DATE;
  }
  fetch('briefing.html', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(t){
    var doc = new DOMParser().parseFromString(t, 'text/html');
    var sec = doc.getElementById('currents');
    if(!sec){ showBase(); return; }
    var title = doc.querySelector('title');
    body.innerHTML = '';
    body.appendChild(document.importNode(sec, true));
    src.textContent = '今日のブリーフィングから' + (title ? '（' + title.textContent.trim() + '）' : '');
  }).catch(showBase);
})();
</script>
